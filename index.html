<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติวสอบ Final · OOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FB; --card:#FFFFFF; --sunk:#F1F2F9; --ink:#1B1F3B; --muted:#6A6F8E; --line:#E3E5F0;
  --p:#5B4BDB; --p2:#8B5CF6; --p-soft:#ECE9FF; --t:#0E9384; --t-soft:#DDF5F1;
  --ok:#139A55; --ok-bg:#E6F7EE; --bad:#E0464C; --bad-bg:#FDECEC; --hl:rgba(255,206,51,.45);
  --sh:0 1px 2px rgba(27,31,59,.05),0 6px 20px rgba(27,31,59,.06);
  --sh-lg:0 12px 40px rgba(76,60,200,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big,.tab,.btn{font-family:"Anuphan","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif}
a{color:var(--p);font-weight:600;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* hero */
.hero{margin:16px 0 0;border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#A78BFA 0%,rgba(167,139,250,0) 55%),linear-gradient(135deg,#4338CA 0%,#6D28D9 100%);box-shadow:var(--sh-lg)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero-in{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(1.55rem,6.2vw,2.2rem);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:.88rem}
.hero .ttl{flex:1;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pills span{font-size:.75rem;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.ring{flex:0 0 auto;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:rgba(255,255,255,.18)} .ring .fgc{stroke:#fff;transition:stroke-dashoffset .6s ease}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .rt b{font-family:"Anuphan",sans-serif;font-size:1.35rem}
.ring .rt small{font-size:.66rem;opacity:.8}
.hero-stats{display:flex;gap:16px;margin-top:12px;font-size:.8rem;color:rgba(255,255,255,.85)}
.hero-stats b{color:#fff;font-size:1rem;font-family:"Anuphan",sans-serif;margin-right:3px}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);margin-top:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
nav.tabs .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:780px;margin:0 auto;scrollbar-width:none}
nav.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;font-weight:600;padding:7px 14px;border-radius:14px;cursor:pointer;line-height:1.25;text-align:left;transition:transform .15s,box-shadow .15s}
.tab small{display:block;color:var(--muted);font-size:.7rem;font-weight:500;font-family:"IBM Plex Sans Thai",sans-serif}
.tab.x{border-color:color-mix(in srgb,var(--p) 35%,var(--line))}
.tab.x::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p2);margin-right:6px;vertical-align:middle}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 40%,transparent)}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab[aria-selected="true"]::before{background:#fff}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--p);outline-offset:2px}

main{padding:24px 0 72px}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}

/* summary */
details.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:24px;box-shadow:var(--sh);overflow:hidden}
details.sum>summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:"Anuphan",sans-serif;font-size:1.05rem}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.sum[open]>summary::after{transform:rotate(-135deg)}
details.sum[open]>summary{border-bottom:1px solid var(--line)}
.sumbody{padding:6px 18px 18px}
.sumbody h4{margin:20px 0 6px;font-size:1rem;font-family:"Anuphan",sans-serif;color:var(--p)}
.sumbody p{margin:6px 0}
.sumbody ol{margin:6px 0;padding-left:22px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .08em;border-radius:2px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{background:var(--sunk);font-weight:600}
td+td,th+th{border-left:1px solid var(--line)}
.formula{background:var(--p-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem;line-height:1.85;font-variant-numeric:tabular-nums}
.note{background:var(--sunk);border-left:3px solid var(--p2);border-radius:8px;padding:9px 12px;font-size:.86rem}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.84rem;padding:5px 12px;border-radius:999px;cursor:pointer;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.reset{margin-left:auto;color:var(--muted);background:transparent;border-style:dashed}
.score{font-size:.88rem;color:var(--muted);margin:0 0 14px}

/* question */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qn{flex:0 0 auto;min-width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-content:center;font-weight:700;font-size:.85rem;font-family:"Anuphan",sans-serif}
.qt{font-weight:600;flex:1;padding-top:3px}
.badge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:auto;align-self:flex-start;margin-top:5px}
.badge.cw{background:#FFF1C2;color:#8A5A00}
.badge.ex{background:var(--p-soft);color:var(--p)}
:root[data-theme="dark"] .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;padding:9px 12px;border-radius:14px;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s,transform .1s}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-content:center;background:var(--sunk);color:var(--muted);font-weight:700;font-size:.8rem;font-family:"Anuphan",sans-serif;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--p);background:color-mix(in srgb,var(--p-soft) 50%,var(--card))}
.opt:hover:not([disabled]) b{background:var(--p);color:#fff}
.opt:active:not([disabled]){transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.exp strong.ok{color:var(--ok)} .exp strong.bad{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:40px 0;background:var(--card);border-radius:18px;border:1px dashed var(--line)}

/* calc / written */
.calc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.calc h3{margin:0 0 6px;font-size:1.12rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc h3 .badge{margin-left:0;margin-top:0}
.steps{margin:10px 0 0;padding:12px 14px 12px 34px;background:var(--sunk);border-radius:12px}
.steps li{margin:4px 0;font-variant-numeric:tabular-nums}
.ex-q{font-weight:500;margin:10px 0 0}
.practice{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.practice p{margin:4px 0}
.reveal{border:1.5px solid var(--line);color:var(--ink);background:var(--card);font:inherit;font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:10px;cursor:pointer}
.reveal:hover{border-color:var(--p);color:var(--p)}
.reveal[data-chk]{background:var(--t);border-color:var(--t);color:#fff}
.ans{font-weight:700;margin-top:6px;color:var(--t)}
.flds{display:grid;gap:10px;margin-top:14px}
.fld{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;align-items:center;font-size:.92rem}
.fld input,.fld select{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink);min-width:0;width:100%;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--p-soft)}
.fm{grid-column:2;font-size:.84rem;font-weight:700}
.fm.ok{color:var(--ok)} .fm.bad{color:var(--bad)}
#calcref .calc{border:none;box-shadow:none;padding:14px 0;border-bottom:1px solid var(--line);border-radius:0;margin:0}

/* mock / buttons */
.mockbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.btn{border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 35%,transparent);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center}
.result .big{font-size:2.2rem;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result .rb{flex:1}
.result .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex;margin-top:8px}
.result .bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lc{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);color:var(--ink);font-weight:400;transition:transform .15s,border-color .15s}
.lc:hover{transform:translateY(-2px);border-color:var(--p)}
.lc .k{font-size:.75rem;color:var(--p);font-weight:700}
.lc h3{margin:2px 0 4px;font-size:1.05rem}
.lc p{margin:0;font-size:.8rem;color:var(--muted)}
.lc .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;margin-top:12px}
.lc .bar i{display:block;height:100%}
.kw{display:grid;gap:10px}
.kw div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:no-preference){
  .exp,.steps{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>
pre.code{margin:0 0 12px;padding:12px 14px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.55;white-space:pre;tab-size:4}
code{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--sunk);padding:.05em .35em;border-radius:5px}
.opt span{min-width:0;overflow-wrap:anywhere}
details.ask{background:linear-gradient(135deg,color-mix(in srgb,#FFCE33 16%,var(--card)),var(--card));border:1px solid color-mix(in srgb,#E0A800 35%,var(--line));border-radius:18px;margin-bottom:16px;box-shadow:var(--sh);overflow:hidden}
details.ask>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;font-family:"Anuphan",sans-serif;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.ask>summary::-webkit-details-marker{display:none}
details.ask>summary small{font-weight:500;color:var(--muted);font-size:.78rem;font-family:"IBM Plex Sans Thai",sans-serif}
.asklist{padding:0 18px 14px;display:grid;gap:8px}
.ak{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ak b{display:block;font-size:.92rem}
.ak span{display:block;font-size:.87rem;color:var(--muted);margin-top:2px}
.wtag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;margin-left:6px;vertical-align:middle;font-family:"IBM Plex Sans Thai",sans-serif}
.wtag.hi{background:var(--p-soft);color:var(--p)}
.wtag.lo{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.lc .wtag{margin:0 0 0 4px}
.tab.hi small::after{content:" ●";color:var(--p2)}
.tab[aria-selected="true"].hi small::after{color:#fff}
.qmeta{font-size:.72rem;color:var(--muted);margin:-6px 0 10px 42px}
</style>
</head>
<body>
<header class="wrap"><div class="hero"><div class="hero-in">
  <div class="ttl"><h1>ติวสอบ Final<br>OOP · MIIC1224</h1><p>ทุกบท Lec 1 – Software Testing · เน้นสิ่งที่อาจารย์ชี้</p>
  <div class="pills"><span>ออกตั้งแต่บทที่ 1</span><span>หลังกลางภาคออกเยอะ</span><span>ข้อ Midterm ไม่ออกซ้ำ</span><span>Practice Final 120 ข้อ</span></div></div>
  <div class="ring" aria-hidden="true"><svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="42" fill="none" stroke-width="9"/><circle class="fgc" id="rfg" cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="263.9" stroke-dashoffset="263.9"/></svg><div class="rt"><b id="rpct">0%</b><small>ทำแล้ว</small></div></div>
</div><div class="hero-stats" id="gtxt"></div></div></header>
<nav class="tabs" aria-label="หัวข้อ"><div class="row" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>
<script>
const TOPICS = [];

TOPICS.push({
  id: "l1", lec: "Lec 1", title: "Intro · Java & OOP", w: "lo",
  ask: [
    ["ภาษา C ไม่ใช่ OOP เพราะอะไร", "C เป็นภาษาแบบ procedural ข้อมูล (struct) กับฟังก์ชันอยู่แยกกัน ไม่มี class/object จึงไม่มี encapsulation, inheritance, polymorphism"]
  ],
  summary: `
<p>OOP เป็นหนึ่งใน programming paradigm ร่วมกับ Procedural, Functional, Scripting, Logic</p>
<h4>C (Procedural) vs Java (OOP)</h4>
<table>
<tr><th></th><th>C</th><th>Java</th></tr>
<tr><td>หน่วยหลักของโปรแกรม</td><td>ฟังก์ชัน</td><td>class / object</td></tr>
<tr><td>ข้อมูลกับการทำงาน</td><td><mark>แยกกัน</mark> (struct + ฟังก์ชัน)</td><td>รวมกันในคลาส (field + method)</td></tr>
<tr><td>ซ่อนข้อมูล / สืบทอด / polymorphism</td><td>ไม่มีในตัวภาษา</td><td>มี</td></tr>
</table>
<h4>ข้อดีของ OOP (สไลด์)</h4>
<p>โครงสร้างโปรแกรมชัดเจน · ช่วยให้โค้ด <b>DRY</b> (Don't Repeat Yourself) ดูแล แก้ไข debug ง่าย · reuse ได้ เขียนน้อยลง พัฒนาเร็วขึ้น</p>
<h4>Java ทำงานอย่างไร</h4>
<p><code>.java</code> → <b>javac</b> → <code>.class</code> (<mark>bytecode</mark>) → <b>JVM</b> แปลรันบนเครื่องนั้น → จึงรันได้ทุก OS ที่มี JVM (platform independent)</p>
<p><b>JDK</b> (มี javac ไว้พัฒนา) ⊃ <b>JRE</b> (ไว้รัน) ⊃ <b>JVM</b> (ตัวรัน bytecode)</p>

  summary: `
<p>GUI ใน Java ใช้ <code>javax.swing</code> + <code>java.awt</code> · คลาสหลักขึ้นต้นด้วย <b>J</b></p>
<h4>Component</h4>
<table>
<tr><th>คลาส</th><th>ใช้ทำ</th></tr>
<tr><td>JFrame</td><td>หน้าต่างหลัก ต้อง <code>setVisible(true)</code> · ใส่ของลง content pane</td></tr>
<tr><td>JPanel</td><td>กล่องจัดกลุ่ม component (nesting panels)</td></tr>
<tr><td>JLabel / JButton</td><td>ข้อความหรือรูป / ปุ่มกด</td></tr>
<tr><td>JTextField / JTextArea</td><td>ช่องพิมพ์บรรทัดเดียว / หลายบรรทัด (ใส่ JScrollPane เพื่อมี scroll bar)</td></tr>
<tr><td>JCheckBox / JRadioButton</td><td>เลือกได้หลายอัน / เลือกได้อันเดียวเมื่ออยู่ใน <mark>ButtonGroup เดียวกัน</mark></td></tr>
<tr><td>JOptionPane</td><td>กล่องโต้ตอบ: message, confirm (Yes/No/Cancel), input</td></tr>
</table>
<h4>Menu</h4>
<p><b>JMenuBar</b> (1 frame มีได้ 1 แถบ) → <b>JMenu</b> (หัวข้อ เช่น File, Edit) → <b>JMenuItem</b> (คำสั่งย่อย เช่น Open, Save) → <code>frame.setJMenuBar(bar)</code></p>
<h4>Layout Manager</h4>
<table>
<tr><th>Layout</th><th>วิธีจัด</th></tr>
<tr><td>FlowLayout</td><td>ซ้าย→ขวา ตามลำดับ add ล้นบรรทัดก็ขึ้นบรรทัดใหม่ · ขนาดปุ่มพอดีข้อความ</td></tr>
<tr><td>BorderLayout</td><td>5 พื้นที่ N/S/E/W/Center · <mark>Center ขยายตามหน้าต่าง</mark> · N/S ยืดตามแนวนอน</td></tr>
<tr><td>GridLayout(r, c)</td><td>ตาราง r × c ช่องเท่ากัน วางซ้าย→ขวา บน→ล่าง</td></tr>
<tr><td>null layout</td><td>กำหนดตำแหน่งเองด้วย <code>setBounds</code></td></tr>
</table>
<h4>Event handling</h4>
<p>Event source (ปุ่ม) → สร้าง event → <b>listener</b> ที่ลงทะเบียนไว้รับไปทำงาน · คลาส <code>implements ActionListener</code> เขียน <code>actionPerformed(ActionEvent e)</code> แล้ว <code>button.addActionListener(handler)</code> · ทำได้ทั้งคลาสแยก, ให้ frame เป็น listener เอง หรือ anonymous inner class / lambda</p>

<h4>แนวคิด</h4>
<p><b>Multitasking (time-sharing)</b>: CPU ตัวเดียวสลับทำหลายงาน · <b>Multiprocessing</b>: มีหลาย CPU ทำพร้อมกันจริง · <b>Thread</b> = ลำดับคำสั่งหนึ่งสายในโปรแกรม</p>
<h4>สร้าง thread 2 วิธี</h4>
<p>1) <code>class T extends Thread</code> แล้ว override <code>run()</code> · 2) <code>class R implements Runnable</code> แล้วส่งให้ <code>new Thread(r)</code> (ดีกว่าเพราะยัง extends คลาสอื่นได้)</p>
<p><mark>ต้องเรียก <code>start()</code></mark> จึงจะได้ thread ใหม่ ซึ่งจะเรียก run() ให้เอง · เรียก <code>run()</code> ตรง ๆ = ทำใน thread ปัจจุบัน ไม่มี thread ใหม่</p>
<h4>สถานะ (ตามสไลด์)</h4>
<table>
<tr><th>สถานะ</th><th>เมื่อไร</th></tr>
<tr><td>New</td><td>สร้าง object แล้ว ยังไม่ start()</td></tr>
<tr><td>Runnable</td><td>พร้อมทำงาน รอ scheduler เลือก</td></tr>
<tr><td>Running</td><td>กำลังใช้ CPU</td></tr>
<tr><td>Blocked</td><td>sleep(), รอ IO, รอ lock, wait()</td></tr>
<tr><td>Dead</td><td>run() จบ หรือเกิด exception ที่ไม่ได้จัดการ</td></tr>
</table>
<p>Scheduler แบบ <b>non-preemptive</b> (thread ทำจนหยุดเอง) / <b>preemptive</b> (ถูกแย่ง CPU ได้เมื่อหมดเวลาหรือมี priority สูงกว่า) · ลำดับการทำงานของ thread <mark>คาดเดาไม่ได้</mark></p>
<h4>ปัญหาข้อมูลร่วม</h4>
<p><b>Race condition</b>: หลาย thread แก้ตัวแปรเดียวกันพร้อมกัน (เช่น <code>count++</code>) ผลผิด → ใช้ <code>synchronized</code> บน <mark>lock ตัวเดียวกัน</mark> · <code>synchronized(new Object())</code> ไม่ช่วยเพราะได้ lock ใหม่ทุกครั้ง</p>
<p><code>join()</code> รอให้ thread อื่นจบก่อน · <code>sleep()</code> ใน synchronized <mark>ไม่ปล่อย lock</mark> · <code>wait()/notify()</code> ใช้ประสานงาน · Deadlock: สองงานขอ lock สลับลำดับกัน → แก้โดยขอ lock ตามลำดับเดียวกันเสมอ</p>`,

<p><b>Multiplicity</b>: <code>1</code> พอดีหนึ่ง · <code>0..1</code> · <code>*</code> หรือ <code>0..*</code> · <code>1..*</code> · <code>2..5</code> · อ่าน: <code>[Reservation] 1 —— 2..5 [Seat]</code> = หนึ่งการจองมีที่นั่ง 2–5 ที่ และแต่ละที่นั่งอยู่ในการจองเดียว</p>

<h4>GRASP (มอบหน้าที่ให้ใคร)</h4>

<tr><th>Pattern</th><th>คำถามที่ตอบ</th></tr>

</table>

<p><b>Testing</b> ช่วย<mark>พบ</mark>ปัญหา · <b>Debugging</b> ช่วย<mark>หาสาเหตุและแก้</mark> · คอมไพล์ผ่าน ≠ ถูกต้อง (compiler ไม่ตรวจ logic)</p>

<tr><th>ระดับ</th><th>ตรวจอะไร</th><th>ลักษณะ</th></tr>
<tr><td>Unit test</td><td>หน่วยเล็ก (คลาส/เมธอด) แยกจาก dependency จริง</td><td>เร็ว มีจำนวนมาก</td></tr>
<tr><td>Integration test</td><td>ส่วนต่าง ๆ ทำงานร่วมกัน (ไฟล์จริง, DB)</td><td>ช้ากว่า</td></tr>
<tr><td>System / E2E</td><td>เปิดแอปจริง ทำตามขั้นตอนผู้ใช้ตั้งแต่ต้นจนจบ</td><td>ช้าสุด จำนวนน้อย</td></tr>
</table>
<h4>ออกแบบ test case</h4>
<p><b>Equivalence Partitioning</b>: แบ่งกลุ่ม input ที่ทำงานเหมือนกัน เลือกตัวแทนกลุ่มละตัว · <b>Boundary Value</b>: ทดสอบ<mark>ค่าที่รอยต่อ</mark> (เกรด A ≥ 80 → ทดสอบ 79 และ 80 จับบั๊ก &gt; กับ &gt;= ได้) · <b>Decision Table</b>: หลายเงื่อนไขผสมกัน · <b>Black-box</b> ดูจากข้อกำหนด / <b>White-box</b> ดูจากโค้ดภายใน</p>
<h4>JUnit</h4>
<p><code>@Test</code> · <code>assertEquals(expected, actual)</code> (expected มาก่อน) · <code>assertTrue/False</code> · <code>assertNull</code> · <code>assertArrayEquals</code> (เทียบสมาชิก) · <code>assertThrows(X.class, () -&gt; ...)</code> (ส่ง lambda ไม่ใช่เรียกเลย) · <code>assertAll</code></p>
<p>โครง <b>Arrange – Act – Assert</b> · <code>@BeforeEach</code> เตรียม fixture ใหม่ทุกเทสต์ · เทสต์ต้องไม่พึ่งลำดับกัน · <code>@ParameterizedTest</code> + <code>@ValueSource</code> / <code>@CsvSource</code></p>
<h4>TDD</h4>
<p><mark>Red → Green → Refactor</mark>: เขียนเทสต์ที่ล้มก่อน → เขียนโค้ดน้อยที่สุดให้ผ่าน → ปรับโค้ดโดยพฤติกรรมเดิม</p>
<h4>Test Doubles (Mockito)</h4>
<p>แทน dependency ที่มีผลข้างเคียง (ส่งอีเมล, DB) · <b>Stub</b> กำหนดคำตอบ (<code>when(...).thenReturn(...)</code>) · <b>Mock</b> ตรวจว่าถูกเรียก (<code>verify(...)</code>) · <b>Fake</b> ทำงานจริงแบบง่าย (repository ในหน่วยความจำ) · รับ dependency ผ่าน constructor เพื่อให้แทนได้</p>
<h4>คุณภาพของเทสต์</h4>
<p><b>Coverage</b> บอกว่าโค้ดบรรทัดไหนถูกเรียก <mark>ไม่ได้บอกว่าตรวจถูก</mark> 100% ก็ยังมีบั๊กได้ · <b>Flaky test</b> ผ่านบ้างพังบ้าง (เวลา, random, ลำดับ) → ควบคุมด้วย Clock ที่ส่งเข้ามา · <b>Regression test</b> เก็บเทสต์ของบั๊กที่แก้แล้วไว้กันเกิดซ้ำ · <b>CI</b> รันเทสต์อัตโนมัติทุกครั้งที่โค้ดเปลี่ยน</p>`,
  quiz: [
    {s:"t", q:"กติกา: คะแนน ≥ 80 ได้ A โค้ดเขียนเงื่อนไขผิดเป็น score > 80 ค่าทดสอบใดจับบั๊กนี้ได้", o:["80","90","50","100"], a:0, e:"Boundary value: บั๊ก > กับ >= เห็นเฉพาะที่รอยต่อ 80 ได้ B แทน A"},
    {s:"t", q:"Equivalence Partitioning คืออะไร", o:["แบ่ง input ที่คาดว่าทำงานเหมือนกันเป็นกลุ่ม แล้วเลือกตัวแทนจากแต่ละกลุ่มมาทดสอบ","ทดสอบทุกค่าที่เป็นไปได้","ทดสอบเฉพาะค่าที่ขอบของช่วง","แบ่งทีมทดสอบเป็นกลุ่มเท่า ๆ กัน"], a:0, e:"ข้อ 3 คือ Boundary Value Analysis"},
    {s:"t", q:"การเรียก assertEquals ข้อใดเขียนตามรูปแบบที่ถูกต้อง เมื่อคาดว่า add(2, 3) ต้องได้ 5", o:["assertEquals(5, calc.add(2, 3));","assertEquals(calc.add(2, 3), 5);","assertTrue(calc.add(2, 3) > 0);","assertEquals(calc.add(2, 3));"], a:0, e:"expected มาก่อน actual · assertTrue(> 0) อ่อนเกินไป ผลผิดอย่าง 6 ก็ผ่าน"},
    {s:"t", q:"reserve(0) ต้องโยน IllegalArgumentException การเขียนเทสต์ข้อใดถูกต้อง", o:["assertThrows(IllegalArgumentException.class, () -> svc.reserve(0));","assertThrows(IllegalArgumentException.class, svc.reserve(0));","svc.reserve(0); assertThrows(IllegalArgumentException.class);","assertEquals(IllegalArgumentException.class, svc.reserve(0));"], a:0, e:"ต้องส่ง \"งานที่จะทำ\" เป็น lambda ให้ assertThrows เรียกเอง ถ้าเรียก reserve(0) ก่อน exception จะเกิดก่อนเข้า assertThrows"},
    {s:"t", q:"ชุดทดสอบเปิดแอปจริง กรอกข้อมูลผ่านหน้าจอ ยืนยันการสมัคร แล้วตรวจว่าเข้าสู่ระบบด้วยบัญชีใหม่ได้ เป็นการทดสอบระดับใด", o:["System / End-to-End test","Unit test","Static analysis","Mutation test"], a:0, e:"ทดสอบทั้งระบบตามเส้นทางของผู้ใช้จริง"},
    {s:"t", q:"ชุดเทสต์ได้ line coverage 100% ข้อสรุปใดถูกต้อง", o:["ทุกบรรทัดถูกเรียกอย่างน้อยครั้งหนึ่ง แต่ยังอาจไม่ได้ตรวจผลที่ถูกต้องหรือกรณีที่ขาด","โปรแกรมไม่มีบั๊กแน่นอน","ทุก branch และทุก input ถูกทดสอบแล้ว","ไม่ต้องเขียนเทสต์เพิ่มอีก"], a:0, e:"coverage เป็นแผนที่หาช่องว่าง ไม่ใช่คะแนนรับประกัน"},
    {s:"t", q:"ลำดับของ TDD คือข้อใด", o:["Red → Green → Refactor","Green → Red → Refactor","Refactor → Red → Green","Code → Test → Deploy"], a:0, e:"เขียนเทสต์ให้ล้มก่อน แล้วทำให้ผ่าน แล้วจึงปรับโค้ด"},
    {s:"t", q:"เขียน unit test ให้ RegistrationService ที่ส่งอีเมลยืนยัน ไม่ต้องการให้ส่งอีเมลจริง และอยากตรวจว่าได้สั่งส่งอีเมลหนึ่งครั้ง ควรทำอย่างไร", o:["แทน EmailSender ด้วย mock แล้วใช้ verify ตรวจว่าถูกเรียก","ส่งอีเมลจริงไปที่อีเมลทดสอบ","ปิดการทดสอบเรื่องอีเมล","mock RegistrationService แทน"], a:0, e:"mock dependency ที่มีผลข้างเคียง ไม่ mock คลาสที่เรากำลังทดสอบเอง"},
    {s:"ex", q:"โค้ดคอมไพล์ผ่านด้วย javac แล้ว ผู้พัฒนาบอกว่าไม่ต้องทดสอบอีก ข้อใดถูก", o:["ไม่ถูก compiler ตรวจไวยากรณ์และชนิด แต่ไม่ตรวจว่า logic ตรงกับข้อกำหนด","ถูก compiler ตรวจ logic ให้แล้ว","ถูก ถ้าไม่มี warning","ถูก ถ้าใช้ IDE"], a:0, e:"logical error คอมไพล์ผ่านได้เสมอ"},
    {s:"ex", q:"ข้อกำหนด: countPositive ต้องนับเฉพาะเลข > 0 แต่โค้ดใช้ >= 0 input ใดทำให้เทสต์จับบั๊กได้", o:["[0, 5] คาดว่าได้ 1","[3, 5] คาดว่าได้ 2","[-1, -2] คาดว่าได้ 0","[] คาดว่าได้ 0"], a:0, e:"ต้องมี 0 ใน input จึงเห็นความต่างระหว่าง > กับ >="},
    {s:"ex", q:"เทสต์ของคลาส Offer ผ่านบ้างพังบ้างขึ้นกับวันที่รัน เพราะเรียก LocalDate.now() ตรง ๆ วิธีแก้ที่ดีคือ", o:["ส่ง Clock เข้ามาแล้วใช้ LocalDate.now(clock) ในเทสต์ใช้ Clock คงที่","กด rerun จนกว่าจะผ่าน","ปิดเทสต์นี้","รันเทสต์เฉพาะวันจันทร์"], a:0, e:"flaky test ต้องหาสาเหตุความไม่แน่นอนแล้วควบคุมมัน"},
    {s:"ex", q:"Black-box testing ต่างจาก White-box testing อย่างไร", o:["Black-box ออกแบบเทสต์จากข้อกำหนดโดยไม่ดูโค้ด ส่วน White-box ดูโครงสร้างโค้ดภายใน","Black-box ทดสอบเฉพาะ UI ส่วน White-box ทดสอบฐานข้อมูล","Black-box ทำมือ White-box ทำอัตโนมัติ","ไม่ต่างกัน"], a:0, e:"เป็นคนละมุมมองที่ใช้ร่วมกันได้"},
    {s:"ex", q:"@BeforeEach ใน JUnit ใช้ทำอะไร", o:["เตรียม fixture ใหม่ก่อนทุกเมธอดทดสอบ ให้แต่ละเทสต์เริ่มจากสถานะสะอาด","รันครั้งเดียวก่อนทุกเทสต์ในคลาส","กำหนดลำดับให้เทสต์รันตามกัน","ข้ามเทสต์ที่ไม่ต้องการ"], a:0, e:"ครั้งเดียวก่อนทั้งคลาสคือ @BeforeAll"}
  ]
});

</script>
<script>
const KEY = "oopfinal-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const L = "ABCDE";
function seeded(seed) { let h = 7; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }; }
function ordFor(key, q) { const n = q.o.map((_, i) => i); const r = seeded(key); for (let i = n.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; } return n; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wrapTables = h => h.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, '</table></div>');
const WT = { hi: "หลังกลางภาค · ออกเยอะ", lo: "ก่อนกลางภาค · ออกประปราย" };

const PAGES = [{ id: "home", lec: "ภาพรวม", title: "แนวสอบ + ความคืบหน้า" }, { id: "mock", lec: "สอบรวม", title: "สุ่มทุกบท" }, ...TOPICS.map(t => ({ id: t.id, lec: t.lec, title: t.title, w: t.w }))];
let cur = location.hash.slice(1) || "home";
if (!PAGES.find(p => p.id === cur)) cur = "home";
const filt = {};

function renderTabs() {
  document.getElementById("tabs").innerHTML = PAGES.map(p => `<button class="tab${p.id === "mock" ? " x" : ""}${p.w === "hi" ? " hi" : ""}" role="tab" aria-selected="${p.id === cur}" data-id="${p.id}">${esc(p.lec)}<small>${esc(p.title)}</small></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => go(b.dataset.id));
  const a = document.querySelector('.tab[aria-selected="true"]'); if (a) a.scrollIntoView({ block: "nearest", inline: "center" });
}
function go(id) { cur = id; try { history.replaceState(null, "", "#" + id); } catch (e) {} renderTabs(); render(); window.scrollTo(0, 0); }

function globalMeter() {
  let tot = 0, ok = 0, bad = 0;
  TOPICS.forEach(t => { tot += t.quiz.length; const s = store[t.id] || {}; t.quiz.forEach((q, i) => { if (s[i] !== undefined) { s[i] === q.a ? ok++ : bad++; } }); });
  const done = ok + bad, pct = Math.round(done / tot * 100);
  document.getElementById("rfg").style.strokeDashoffset = 263.9 * (1 - done / tot);
  document.getElementById("rpct").textContent = pct + "%";
  document.getElementById("gtxt").innerHTML = `<span><b>${done}</b>/ ${tot} ข้อ</span><span><b>${ok}</b>ถูก</span><span><b>${done ? Math.round(ok / done * 100) : 0}%</b>ความแม่น</span>`;
}

function qCard(q, num, picked, key, order, tag) {
  const ord = order || q.o.map((_, i) => i);
  const done = picked !== undefined;
  const opts = ord.map((oi, pos) => {
    let cls = ""; if (done) { if (oi === q.a) cls = "right"; else if (oi === picked) cls = "wrong"; }
    return `<button class="opt ${cls}" data-k="${key}" data-o="${oi}" ${done ? "disabled" : ""}><b>${L[pos]}</b><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  let exp = "";
  if (done) { const okk = picked === q.a; exp = `<div class="exp"><strong class="${okk ? "ok" : "bad"}">${okk ? "ถูก" : "ผิด — ตอบ " + L[ord.indexOf(q.a)]}</strong> · ${esc(q.e)}</div>`; }
  const badge = q.s === "t" ? `<span class="badge cw">อาจารย์ชี้</span>` : `<span class="badge ex">ฝึกเพิ่ม</span>`;
  return `<div class="q"><div class="qh"><span class="qn">${num}</span><span class="qt">${esc(q.q)}</span>${badge}</div>${tag ? `<div class="qmeta">${esc(tag)}</div>` : ""}${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}<div class="opts">${opts}</div>${exp}</div>`;
}

function renderHome(v) {
  const cards = TOPICS.map(t => {
    const s = store[t.id] || {}; const n = Object.keys(s).length; const ok = t.quiz.filter((q, i) => s[i] === q.a).length; const tc = t.quiz.filter(q => q.s === "t").length;
    return `<a class="lc" href="#${t.id}" data-go="${t.id}"><span class="k">${esc(t.lec)}<span class="wtag ${t.w}">${t.w === "hi" ? "ออกเยอะ" : "ประปราย"}</span></span><h3>${esc(t.title)}</h3><p>อาจารย์ชี้ ${tc} + ฝึกเพิ่ม ${t.quiz.length - tc} ข้อ · ถูก ${ok}/${n}</p><div class="bar"><i class="g" style="width:${ok / t.quiz.length * 100}%"></i><i class="r" style="width:${(n - ok) / t.quiz.length * 100}%"></i></div></a>`;
  }).join("");
  const hi = TOPICS.filter(t => t.w === "hi"), lo = TOPICS.filter(t => t.w === "lo");
  v.innerHTML = `<h2>ภาพรวม</h2><p class="sub">แต่ละบทมี "คำถามที่อาจารย์ชี้" (จากโน้ตเพื่อน + คลิปทบทวน) พร้อมคำตอบสั้น สรุปเนื้อหา และข้อสอบแนวเดียวกับ Practice Final ระบบจำคำตอบไว้ในเครื่องนี้</p>
  <div class="kw">
  <div><b>ขอบเขต</b> ออกตั้งแต่บทที่ 1 แต่ไม่เอาข้อ Midterm มาออกซ้ำ · บทก่อนกลางภาคออกประปราย · <mark>บทหลังกลางภาคออกเยอะกว่า</mark></div>
  <div><b>ลำดับแนะนำ</b> อ่านกล่อง "อาจารย์ชี้" → อ่านสรุป → ทำข้อ "อาจารย์ชี้" → ทำข้อฝึกเพิ่ม → กรอง "ข้อที่ผิด" ทำซ้ำ → <a href="#mock" data-go="mock">สอบรวม</a></div>
  <div><b>อาจารย์ย้ำในคลิป</b> GoF ถาม concept ไม่ให้เขียนโปรแกรม · Socket ถาม accept() และช่วง port · Stream ให้โค้ดแล้วถาม output · Abstract Factory = สร้าง object เป็นชุดที่เข้ากัน · UML เป็นทฤษฎี ดู lab</div>
  <div><b>จุดที่ควรเช็คกับสไลด์</b> Composite (อาจารย์พูดว่าแตกแค่ 2 ทาง) · port (อาจารย์พูด 64 บิต สไลด์บอก 16 บิต) · StringBuilder (สไลด์หน้า 31 บอก thread-safe แต่จริง ๆ คือ StringBuffer)</div>
  </div>
  <h2 style="margin-top:28px">หลังกลางภาค <span class="wtag hi">ออกเยอะ</span></h2><p class="sub">${hi.length} หัวข้อ</p>
  <div class="grid">${cards.split("</a>").filter(x => x).filter((_, i) => TOPICS[i].w === "hi").map(x => x + "</a>").join("")}</div>
  <h2 style="margin-top:28px">ก่อนกลางภาค <span class="wtag lo">ประปราย</span></h2><p class="sub">${lo.length} หัวข้อ</p>
  <div class="grid">${cards.split("</a>").filter(x => x).filter((_, i) => TOPICS[i].w === "lo").map(x => x + "</a>").join("")}</div>`;
}

function renderTopic(v, t) {
  const s = store[t.id] || (store[t.id] = {});
  const f = filt[t.id] || "all";
  const idx = t.quiz.map((q, i) => i).filter(i => f === "all" || (f === "wrong" ? (s[i] !== undefined && s[i] !== t.quiz[i].a) : t.quiz[i].s === f));
  const ok = t.quiz.filter((q, i) => s[i] === q.a).length, n = Object.keys(s).length;
  const ch = (k, lab) => `<button class="chip" aria-pressed="${f === k}" data-f="${k}">${lab}</button>`;
  v.innerHTML = `<h2>${esc(t.lec)} · ${esc(t.title)}</h2><p class="sub"><span class="wtag ${t.w}" style="margin-left:0">${WT[t.w]}</span> · ${t.quiz.length} ข้อ</p>
  <details class="ask" open><summary>อาจารย์ชี้หัวข้อนี้ = ออกสอบ <small>${t.ask.length} ประเด็น</small></summary><div class="asklist">${t.ask.map(([q, a]) => `<div class="ak"><b>${q}</b><span>${a}</span></div>`).join("")}</div></details>
  <details class="sum" open><summary>สรุปหัวข้อ</summary><div class="sumbody">${wrapTables(t.summary)}</div></details>
  <div class="filters">${ch("all", "ทั้งหมด")}${ch("t", "อาจารย์ชี้")}${ch("ex", "ฝึกเพิ่ม")}${ch("wrong", "ข้อที่ผิด")}<button class="chip reset" id="rst">ล้างคำตอบบทนี้</button></div>
  <p class="score">ถูก ${ok} จาก ${n} ข้อที่ทำ</p>
  <div id="qs">${idx.length ? idx.map(i => qCard(t.quiz[i], i + 1, s[i], t.id + ":" + i, ordFor(t.id + ":" + i, t.quiz[i]))).join("") : `<p class="empty">${f === "wrong" ? "ยังไม่มีข้อที่ผิด" : "ไม่มีข้อในหมวดนี้"}</p>`}</div>`;
  v.querySelectorAll(".chip[data-f]").forEach(b => b.onclick = () => { filt[t.id] = b.dataset.f; render(); });
  v.querySelector("#rst").onclick = () => { if (confirm("ล้างคำตอบทั้งหมดของบทนี้?")) { store[t.id] = {}; save(); render(); } };
  bindOpts(v, t);
}
function bindOpts(v, t) {
  v.querySelectorAll(".opt:not([disabled])").forEach(b => {
    b.onclick = () => {
      const [tid, qi] = b.dataset.k.split(":"); store[tid][qi] = +b.dataset.o; save();
      b.closest(".q").outerHTML = qCard(t.quiz[qi], +qi + 1, +b.dataset.o, b.dataset.k, ordFor(b.dataset.k, t.quiz[qi]));
      bindOpts(v, t); updScore(v, t); globalMeter();
    };
  });
}
function updScore(v, t) { const s = store[t.id]; const ok = t.quiz.filter((q, i) => s[i] === q.a).length; v.querySelector(".score").textContent = `ถูก ${ok} จาก ${Object.keys(s).length} ข้อที่ทำ`; }

let mock = null;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startMock(n) {
  const hi = [], lo = [];
  TOPICS.forEach(t => t.quiz.forEach(q => (t.w === "hi" ? hi : lo).push({ ...q, ref: t.lec + " · " + t.title })));
  let pick;
  if (n >= hi.length + lo.length) pick = shuffle([...hi, ...lo]);
  else { const nh = Math.min(hi.length, Math.round(n * 0.75)); pick = shuffle([...shuffle(hi).slice(0, nh), ...shuffle(lo).slice(0, n - nh)]); }
  mock = { n, qs: pick.map(q => ({ q, order: shuffle(q.o.map((_, i) => i)), p: undefined })) };
  render();
}
function renderMock(v) {
  let h = `<h2>สอบรวม</h2><p class="sub">สุ่มจากทุกบท เน้นหลังกลางภาค 75% ก่อนกลางภาค 25% และสลับตำแหน่งตัวเลือก ตอบแล้วเฉลยทันที</p><div class="mockbar">${[[30, "สุ่ม 30 ข้อ"], [60, "สุ่ม 60 ข้อ"], [9999, "ทุกข้อ"]].map(([n, l]) => `<button class="btn${mock && mock.n === n ? "" : " ghost"}" data-n="${n}">${l}</button>`).join("")}</div>`;
  if (mock) {
    const ans = mock.qs.filter(x => x.p !== undefined), ok = ans.filter(x => x.p === x.q.a).length;
    h += `<div class="result"><div class="big">${ok}<span style="font-size:1.1rem">/${mock.qs.length}</span></div><div class="rb"><div>ตอบแล้ว ${ans.length} ข้อ${ans.length === mock.qs.length ? ` · ได้ ${Math.round(ok / mock.qs.length * 100)}%` : ""}</div><div class="bar"><i class="g" style="width:${ok / mock.qs.length * 100}%"></i><i class="r" style="width:${(ans.length - ok) / mock.qs.length * 100}%"></i></div></div></div>`;
    h += mock.qs.map((x, i) => qCard(x.q, i + 1, x.p, "m:" + i, x.order, x.q.ref)).join("");
  } else {
    h += `<p class="empty">เลือกจำนวนข้อด้านบนเพื่อเริ่ม</p>`;
  }
  v.innerHTML = h;
  v.querySelectorAll(".btn[data-n]").forEach(b => b.onclick = () => startMock(+b.dataset.n));
  v.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => { const i = +b.dataset.k.split(":")[1]; mock.qs[i].p = +b.dataset.o; const y = window.scrollY; render(); window.scrollTo(0, y); });
}

function render() {
  const v = document.getElementById("view");
  if (cur === "home") renderHome(v);
  else if (cur === "mock") renderMock(v);
  else renderTopic(v, TOPICS.find(t => t.id === cur));
  v.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  globalMeter();
}
renderTabs(); render();

</script>
</body>
