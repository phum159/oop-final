<style>
:root{
  --bg:#F4F5FB; --card:#FFFFFF; --sunk:#F1F2F9; --ink:#1B1F3B; --muted:#6A6F8E; --line:#E3E5F0;
  --p:#5B4BDB; --p2:#8B5CF6; --p-soft:#ECE9FF; --t:#0E9384; --t-soft:#DDF5F1;
  --ok:#139A55; --ok-bg:#E6F7EE; --bad:#E0464C; --bad-bg:#FDECEC; --hl:rgba(255,206,51,.45);
  --sh:0 1px 2px rgba(27,31,59,.05),0 6px 20px rgba(27,31,59,.06);
  --sh-lg:0 12px 40px rgba(76,60,200,.28);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --card:#171A2E; --sunk:#1F2339; --ink:#E9EAF6; --muted:#9A9EBE; --line:#2A2E48;
  --p:#8B7CFF; --p2:#B794FF; --p-soft:rgba(139,124,255,.16); --t:#3DD6C3; --t-soft:rgba(61,214,195,.14);
  --ok:#3DD68C; --ok-bg:rgba(61,214,140,.13); --bad:#FF6B70; --bad-bg:rgba(255,107,112,.13); --hl:rgba(255,206,51,.28);
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --sh-lg:0 12px 40px rgba(0,0,0,.45); color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai","Leelawadee UI","Thonburi","Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,h3,.big,.tab,.btn{font-family:"Anuphan","IBM Plex Sans Thai","Leelawadee UI",system-ui,sans-serif}
a{color:var(--p);font-weight:600;text-decoration:none}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}

/* hero */
.hero{margin:16px 0 0;border-radius:24px;padding:22px 20px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,#A78BFA 0%,rgba(167,139,250,0) 55%),linear-gradient(135deg,#4338CA 0%,#6D28D9 100%);box-shadow:var(--sh-lg)}
.hero::after{content:"";position:absolute;right:-60px;bottom:-80px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07)}
.hero-in{display:flex;gap:18px;align-items:center;position:relative;z-index:1}
.hero h1{font-size:clamp(1.55rem,6.2vw,2.2rem);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
.hero p{margin:6px 0 0;color:rgba(255,255,255,.82);font-size:.88rem}
.hero .ttl{flex:1;min-width:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pills span{font-size:.75rem;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);padding:3px 10px;border-radius:999px;white-space:nowrap}
.ring{flex:0 0 auto;width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:rgba(255,255,255,.18)} .ring .fgc{stroke:#fff;transition:stroke-dashoffset .6s ease}
.ring .rt{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring .rt b{font-family:"Anuphan",sans-serif;font-size:1.35rem}
.ring .rt small{font-size:.66rem;opacity:.8}
.hero-stats{display:flex;gap:16px;margin-top:12px;font-size:.8rem;color:rgba(255,255,255,.85)}
.hero-stats b{color:#fff;font-size:1rem;font-family:"Anuphan",sans-serif;margin-right:3px}

/* tabs */
nav.tabs{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);margin-top:14px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
nav.tabs .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;max-width:780px;margin:0 auto;scrollbar-width:none}
nav.tabs .row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.9rem;font-weight:600;padding:7px 14px;border-radius:14px;cursor:pointer;line-height:1.25;text-align:left;transition:transform .15s,box-shadow .15s}
.tab small{display:block;color:var(--muted);font-size:.7rem;font-weight:500;font-family:"IBM Plex Sans Thai",sans-serif}
.tab.x{border-color:color-mix(in srgb,var(--p) 35%,var(--line))}
.tab.x::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--p2);margin-right:6px;vertical-align:middle}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:linear-gradient(135deg,var(--p),var(--p2));border-color:transparent;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 40%,transparent)}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab[aria-selected="true"]::before{background:#fff}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--p);outline-offset:2px}

main{padding:24px 0 72px}
h2{font-size:1.6rem;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}

/* summary */
details.sum{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:24px;box-shadow:var(--sh);overflow:hidden}
details.sum>summary{cursor:pointer;padding:15px 18px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:"Anuphan",sans-serif;font-size:1.05rem}
details.sum>summary::-webkit-details-marker{display:none}
details.sum>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
details.sum[open]>summary::after{transform:rotate(-135deg)}
details.sum[open]>summary{border-bottom:1px solid var(--line)}
.sumbody{padding:6px 18px 18px}
.sumbody h4{margin:20px 0 6px;font-size:1rem;font-family:"Anuphan",sans-serif;color:var(--p)}
.sumbody p{margin:6px 0}
.sumbody ol{margin:6px 0;padding-left:22px}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .08em;border-radius:2px}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:420px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
tr:last-child td{border-bottom:none}
th{background:var(--sunk);font-weight:600}
td+td,th+th{border-left:1px solid var(--line)}
.formula{background:var(--p-soft);border-radius:12px;padding:12px 14px;margin:10px 0;font-size:.92rem;line-height:1.85;font-variant-numeric:tabular-nums}
.note{background:var(--sunk);border-left:3px solid var(--p2);border-radius:8px;padding:9px 12px;font-size:.86rem}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.84rem;padding:5px 12px;border-radius:999px;cursor:pointer;transition:background .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.reset{margin-left:auto;color:var(--muted);background:transparent;border-style:dashed}
.score{font-size:.88rem;color:var(--muted);margin:0 0 14px}

/* question */
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.qh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.qn{flex:0 0 auto;min-width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p);display:grid;place-content:center;font-weight:700;font-size:.85rem;font-family:"Anuphan",sans-serif}
.qt{font-weight:600;flex:1;padding-top:3px}
.badge{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;margin-left:auto;align-self:flex-start;margin-top:5px}
.badge.cw{background:#FFF1C2;color:#8A5A00}
.badge.ex{background:var(--p-soft);color:var(--p)}
:root[data-theme="dark"] .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.cw{background:rgba(255,206,51,.16);color:#FFD66B}}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.95rem;padding:9px 12px;border-radius:14px;cursor:pointer;line-height:1.5;transition:border-color .15s,background .15s,transform .1s}
.opt b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-content:center;background:var(--sunk);color:var(--muted);font-weight:700;font-size:.8rem;font-family:"Anuphan",sans-serif;transition:background .15s,color .15s}
.opt:hover:not([disabled]){border-color:var(--p);background:color-mix(in srgb,var(--p-soft) 50%,var(--card))}
.opt:hover:not([disabled]) b{background:var(--p);color:#fff}
.opt:active:not([disabled]){transform:scale(.99)}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.right):not(.wrong){opacity:.6}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong b{background:var(--bad);color:#fff}
.exp{margin-top:12px;font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--sunk)}
.exp strong.ok{color:var(--ok)} .exp strong.bad{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:40px 0;background:var(--card);border-radius:18px;border:1px dashed var(--line)}

/* calc / written */
.calc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.calc h3{margin:0 0 6px;font-size:1.12rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.calc h3 .badge{margin-left:0;margin-top:0}
.steps{margin:10px 0 0;padding:12px 14px 12px 34px;background:var(--sunk);border-radius:12px}
.steps li{margin:4px 0;font-variant-numeric:tabular-nums}
.ex-q{font-weight:500;margin:10px 0 0}
.practice{border-top:1px dashed var(--line);margin-top:14px;padding-top:12px}
.practice p{margin:4px 0}
.reveal{border:1.5px solid var(--line);color:var(--ink);background:var(--card);font:inherit;font-size:.84rem;font-weight:600;padding:6px 12px;border-radius:10px;cursor:pointer}
.reveal:hover{border-color:var(--p);color:var(--p)}
.reveal[data-chk]{background:var(--t);border-color:var(--t);color:#fff}
.ans{font-weight:700;margin-top:6px;color:var(--t)}
.flds{display:grid;gap:10px;margin-top:14px}
.fld{display:grid;grid-template-columns:minmax(110px,42%) 1fr;gap:4px 10px;align-items:center;font-size:.92rem}
.fld input,.fld select{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sunk);color:var(--ink);min-width:0;width:100%;font-variant-numeric:tabular-nums;transition:border-color .15s,background .15s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--p);background:var(--card);box-shadow:0 0 0 4px var(--p-soft)}
.fm{grid-column:2;font-size:.84rem;font-weight:700}
.fm.ok{color:var(--ok)} .fm.bad{color:var(--bad)}
#calcref .calc{border:none;box-shadow:none;padding:14px 0;border-bottom:1px solid var(--line);border-radius:0;margin:0}

/* mock / buttons */
.mockbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.btn{border:none;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:14px;cursor:pointer;box-shadow:0 6px 16px color-mix(in srgb,var(--p) 35%,transparent);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:18px;box-shadow:var(--sh);display:flex;gap:16px;align-items:center}
.result .big{font-size:2.2rem;font-weight:700;line-height:1;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.result .rb{flex:1}
.result .bar{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex;margin-top:8px}
.result .bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.lc{display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);color:var(--ink);font-weight:400;transition:transform .15s,border-color .15s}
.lc:hover{transform:translateY(-2px);border-color:var(--p)}
.lc .k{font-size:.75rem;color:var(--p);font-weight:700}
.lc h3{margin:2px 0 4px;font-size:1.05rem}
.lc p{margin:0;font-size:.8rem;color:var(--muted)}
.lc .bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;display:flex;margin-top:12px}
.lc .bar i{display:block;height:100%}
.kw{display:grid;gap:10px}
.kw div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:no-preference){
  .exp,.steps{animation:in .22s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><style>

details.ask>summary{cursor:pointer;padding:14px 18px;font-weight:700;list-style:none;font-family:"Anuphan",sans-serif;font-size:1.02rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.ask>summary::-webkit-details-marker{display:none}

.ak{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}

.ak span{display:block;font-size:.87rem;color:var(--muted);margin-top:2px}

.fcf.bk{transform:rotateY(180deg);background:linear-gradient(135deg,color-mix(in srgb,var(--t) 10%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--t) 35%,var(--line))}
.fcf .fk{font-size:.75rem;font-weight:700;color:var(--p);display:flex;justify-content:space-between;gap:8px}
.fcf.bk .fk{color:var(--t)}

.fcf .fq.term{font-size:1.45rem;text-align:center;align-items:center}
.fcf .fa{font-size:1.05rem;font-weight:600;color:var(--ink)}

.fcf .fh{font-size:.75rem;color:var(--muted);text-align:center}
.fcf pre.code{margin:0}
.fcsel{font:inherit;font-size:.88rem;padding:7px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:100%}
.fcsel:disabled{opacity:.5}
.fcnote{font-size:.8rem;color:var(--muted)}
.fcnav{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:10px}

.qmeta{font-size:.72rem;color:var(--muted);margin:-6px 0 10px 42px}

<script>
const TOPICS = [];

TOPICS.push({
  id: "l1", lec: "Lec 1", title: "Intro · Java & OOP", w: "lo",
  ask: [
    ["ภาษา C ไม่ใช่ OOP เพราะอะไร", "C เป็นภาษาแบบ procedural ข้อมูล (struct) กับฟังก์ชันอยู่แยกกัน ไม่มี class/object จึงไม่มี encapsulation, inheritance, polymorphism"]

TOPICS.push({

  summary: `
<p>Generics = เขียนคลาส/เมธอดครั้งเดียว ใช้ได้กับหลายชนิดข้อมูล โดย <code>T</code> แทนชนิดที่จะกำหนดตอนใช้</p>
<h4>ทำไมต้องใช้</h4>
<p>1) <mark>ตรวจชนิดตอนคอมไพล์</mark> → ใส่ผิดชนิดคอมไพล์ไม่ผ่านทันที 2) <mark>ไม่ต้อง cast</mark> ตอนดึงค่าออก</p>
<h4>รูปแบบ</h4>
<p>คลาส: <code>class Box&lt;T&gt; { T value; }</code> → <code>Box&lt;String&gt;</code><br>เมธอด: <code>static &lt;T&gt; T last(List&lt;T&gt; list)</code> → ชนิดที่คืนตรงกับชนิดสมาชิกของ list<br>ตัวย่อ: <code>T</code> Type · <code>E</code> Element · <code>K, V</code> Key/Value</p>
<h4>ข้อควรจำ</h4>
<p>ใช้ primitive ไม่ได้: <code>List&lt;int&gt;</code> ✗ → ใช้ wrapper <code>List&lt;Integer&gt;</code> ✓</p>
<p><code>List&lt;Integer&gt;</code> <mark>ไม่ใช่</mark> <code>List&lt;Number&gt;</code> แม้ Integer เป็นลูกของ Number (ถ้ายอมให้ส่งได้ เมธอดปลายทางจะ add 2.5 ลงใน list ของ Integer ได้)</p>
<p>Wildcard: <code>List&lt;? extends Number&gt;</code> อ่านเป็น Number ได้ · <code>List&lt;? super Integer&gt;</code> ใส่ Integer ได้</p>`,

    {s:"t", q:"ต้องการเมธอด last ตัวเดียวที่ใช้กับ List ทุกชนิด และชนิดที่คืนตรงกับชนิดสมาชิกของ List ควรประกาศอย่างไร", o:["public static <T> T last(List<T> list)","public static Object last(List<Object> list)","public static T last(List list)","public static <T> Object last(T list)"], a:0, e:"ประกาศ <T> หน้า return type แล้วใช้ T ทั้งพารามิเตอร์และค่าที่คืน"},
    {s:"ex", q:"คำสั่ง List<int> nums = new ArrayList<>(); ผลคืออะไร", o:["คอมไพล์ไม่ผ่าน ต้องใช้ List<Integer>","คอมไพล์ผ่าน ใช้งานได้ปกติ","คอมไพล์ผ่าน แต่ add ได้แค่เลขบวก","รันแล้วเกิด ClassCastException"], a:0, e:"type argument ต้องเป็นชนิด reference ใช้ wrapper class แทน primitive"},
    {s:"ex", q:"เมธอด addFraction(List<Number> values) เรียก values.add(2.5) ถ้าส่ง List<Integer> เข้าไป ผลคืออะไร", o:["คอมไพล์ไม่ผ่าน เพราะ List<Integer> ไม่ใช่ชนิดย่อยของ List<Number>","คอมไพล์ผ่าน และ 2.5 ถูกปัดเป็น 2","คอมไพล์ผ่าน แต่รันแล้ว list มี Double ปนอยู่","คอมไพล์ผ่าน เพราะ Integer เป็นลูกของ Number"], a:0, e:"Generics เป็น invariant ถ้ายอมให้ส่งได้ list ของ Integer จะถูกใส่ Double ปน ซึ่งทำลาย type safety"},
    {s:"ex", q:"คลาส Box<T> { T value; } เมื่อประกาศ Box<String> b ข้อใดถูก", o:["b.value มีชนิด String และดึงค่ามาใส่ตัวแปร String ได้โดยไม่ต้อง cast","b.value มีชนิด Object ต้อง cast ทุกครั้ง","Box<String> ใส่ค่า Integer ลง value ได้","ต้องประกาศคลาสใหม่ชื่อ StringBox"], a:0, e:"T ถูกแทนด้วย String ตอนใช้งาน"}

<p>GUI ใน Java ใช้ <code>javax.swing</code> + <code>java.awt</code> · คลาสหลักขึ้นต้นด้วย <b>J</b></p>

<table>
<tr><th>คลาส</th><th>ใช้ทำ</th></tr>
<tr><td>JFrame</td><td>หน้าต่างหลัก ต้อง <code>setVisible(true)</code> · ใส่ของลง content pane</td></tr>

<tr><td>JOptionPane</td><td>กล่องโต้ตอบ: message, confirm (Yes/No/Cancel), input</td></tr>
</table>
<h4>Menu</h4>
<p><b>JMenuBar</b> (1 frame มีได้ 1 แถบ) → <b>JMenu</b> (หัวข้อ เช่น File, Edit) → <b>JMenuItem</b> (คำสั่งย่อย เช่น Open, Save) → <code>frame.setJMenuBar(bar)</code></p>

<h4>Event handling</h4>

  summary: `
<h4>แนวคิด</h4>
<p><b>Multitasking (time-sharing)</b>: CPU ตัวเดียวสลับทำหลายงาน · <b>Multiprocessing</b>: มีหลาย CPU ทำพร้อมกันจริง · <b>Thread</b> = ลำดับคำสั่งหนึ่งสายในโปรแกรม</p>
<h4>สร้าง thread 2 วิธี</h4>
<p>1) <code>class T extends Thread</code> แล้ว override <code>run()</code> · 2) <code>class R implements Runnable</code> แล้วส่งให้ <code>new Thread(r)</code> (ดีกว่าเพราะยัง extends คลาสอื่นได้)</p>
<p><mark>ต้องเรียก <code>start()</code></mark> จึงจะได้ thread ใหม่ ซึ่งจะเรียก run() ให้เอง · เรียก <code>run()</code> ตรง ๆ = ทำใน thread ปัจจุบัน ไม่มี thread ใหม่</p>
<h4>สถานะ (ตามสไลด์)</h4>
<table>
<tr><th>สถานะ</th><th>เมื่อไร</th></tr>
<tr><td>New</td><td>สร้าง object แล้ว ยังไม่ start()</td></tr>
<tr><td>Runnable</td><td>พร้อมทำงาน รอ scheduler เลือก</td></tr>
<tr><td>Running</td><td>กำลังใช้ CPU</td></tr>
<tr><td>Blocked</td><td>sleep(), รอ IO, รอ lock, wait()</td></tr>
<tr><td>Dead</td><td>run() จบ หรือเกิด exception ที่ไม่ได้จัดการ</td></tr>
</table>
<p>Scheduler แบบ <b>non-preemptive</b> (thread ทำจนหยุดเอง) / <b>preemptive</b> (ถูกแย่ง CPU ได้เมื่อหมดเวลาหรือมี priority สูงกว่า) · ลำดับการทำงานของ thread <mark>คาดเดาไม่ได้</mark></p>
<h4>ปัญหาข้อมูลร่วม</h4>
<p><b>Race condition</b>: หลาย thread แก้ตัวแปรเดียวกันพร้อมกัน (เช่น <code>count++</code>) ผลผิด → ใช้ <code>synchronized</code> บน <mark>lock ตัวเดียวกัน</mark> · <code>synchronized(new Object())</code> ไม่ช่วยเพราะได้ lock ใหม่ทุกครั้ง</p>
<p><code>join()</code> รอให้ thread อื่นจบก่อน · <code>sleep()</code> ใน synchronized <mark>ไม่ปล่อย lock</mark> · <code>wait()/notify()</code> ใช้ประสานงาน · Deadlock: สองงานขอ lock สลับลำดับกัน → แก้โดยขอ lock ตามลำดับเดียวกันเสมอ</p>`,

<p>แสดง <mark>แนวคิดในโลกจริง</mark> (conceptual class) + attribute + association · ไม่ใส่เมธอด ไม่ใช่ตารางฐานข้อมูลหรือคลาสซอฟต์แวร์ (Loan ✓ / SqlLoanRow ✗) · ถ้าต้องเก็บประวัติความสัมพันธ์หลายครั้ง (สมาชิกเช่าจักรยานคันเดิมหลายครั้ง) ใช้ class กลางเช่น Rental</p>
<h4>SSD vs DSD</h4>

<h4>GRASP (มอบหน้าที่ให้ใคร)</h4>
<table>
<tr><th>Pattern</th><th>คำถามที่ตอบ</th></tr>
<tr><td>Information Expert</td><td>ให้คนที่<mark>มีข้อมูล</mark>ทำ (OrderItem มี qty, price → คำนวณ lineTotal)</td></tr>

<tr><td>Low Coupling / High Cohesion</td><td>พึ่งพากันน้อย / งานในคลาสเป็นเรื่องเดียวกัน</td></tr>

าง ทั้งที่สร้าง label และ button ไว้แล้ว กำหนดให้โค้ดทำงานบน EDT และตั้งขนาด frame เรียบร้อยแล้ว ควรเพิ่มขั้นตอนใดเพื่อให้ข้อความและปุ่มปรากฏในหน้าต่าง", "o": ["เปลี่ยน label และ button ให้เป็น static เท่านั้น", "เพิ่ม label และ button ลงใน panel แล้วเพิ่ม panel ลงใน frame", "เรียก getText() ของ label เพื่อให้ label ถูกเพิ่มลงใน frame", "สร้าง JFrame อีกตัวแทน JPanel โดยไม่เพิ่ม component ใด ๆ"], "a": 1, "e": "สร้าง component แล้วต้อง add ลง container (panel → frame) จึงจะแสดง", "s": "pf", "c": "JFrame frame = new JFrame();\nJPanel panel = new JPanel();\nJLabel label = new JLabel(\"Ready\");\nJButton button = new JButton(\"Run\");\nframe.setSize(300, 150);\nframe.setVisible(true);"}, {"n": 5, "q": "ในโค้ดด้านล่าง Leaf เป็นคลาสลูกที่สืบทอดจากคลาสแม่ Root โดย Leaf เขียนเมธอด label() ขึ้นใหม่เพื่อต่อข้อความจากผลลัพธ์ของเมธอดในคลาสแม่ เมื่อรันคำสั่งใน main โปรแกรมจะพิมพ์ข้อความใด", "o": ["leaf/base", "base", "base/leaf", "เกิดการเรียกซ้ำไม่สิ้นสุด"], "a": 2, "e": "super.label() คืน \"base\" แล้วต่อด้วย \"/leaf\" · super เรียกเมธอดของแม่ ไม่วนซ้ำ", "s": "pf", "c": "class Root { String label() { return \"base\"; } }\nclass Leaf extends Root {\n    @Override String label() { return super.label() + \"/leaf\"; }\n}\n// ภายใน main\nSystem.out.print(new Leaf().label());"}, {"n": 6, "q": "ข้อมูลหนึ่งบรรทัดใช้ได้ทั้งเครื่องหมายจุลภาค (comma) และอัฒภาค (semicolon) เป็นตัวคั่น โดยไม่มีช่องว่างและไม่มีตัวคั่นติดกัน หากต้องการแยก \"oak,pine;elm\" ออกเป็นสามส่วนด้วยการเรียก split เพียงครั้งเดียว ควรใช้นิพจน์ใด", "o": ["text.split(\";\")", "text.split(\",\")", "text.split(\"[,;]\")", "text.split(\",;\")"], "a": 2, "e": "regex [,;] ตรงกับตัวคั่นตัวใดตัวหนึ่ง ได้ oak, pine, elm · \",;\" คือต้องเจอสองตัวติดกัน", "s": "pf"}, {"n": 7, "q": "ระบบจัดรายการเล่นใช้รูปแบบ Composite โดย Clip.duration() คืนระยะเวลาของคลิป ส่วน Playlist.duration() รวมระยะเวลาของรายการย่อยทุกตัวใน Playlist นั้น หาก Playlist หลักมี Clip ความยาว 10 นาที และ Playlist ย่อยอีกหนึ่งรายการซึ่งมี Clip ความยาว 5 นาทีและ 7 นาที การเรียก duration ของ Playlist หลักจะได้ผลลัพธ์เท่าใด", "o": ["12 นาที", "10 นาที", "22 นาที", "3 นาที"], "a": 2, "e": "Composite รวมผลลูกทุกระดับ: 10 + (5 + 7) = 22", "s": "pf"}, {"n": 8, "q": "เซิร์ฟเวอร์เก็บ Socket ที่รับมาจากการเรียก accept ครั้งล่าสุดไว้ใน field ชื่อ current และให้ worker ทุกตัวอ่าน Socket จาก field นี้เมื่อเริ่มทำงาน ต่อมาพบว่า worker บางตัวสื่อสารกับ client ผิดราย ควรออกแบบการส่ง connection ให้ worker อย่างไรเพื่อแก้ปัญหานี้", "o": ["เพิ่ม sleep โดยหวังว่า field current จะยังไม่เปลี่ยนค่า", "ให้แต่ละงานเก็บและใช้ Socket ของ connection ที่ตนได้รับ แทนการอ่าน field ร่วมที่เก็บ Socket ล่าสุด", "ย้ายการอ่าน Socket ทุกตัวไปทำบน Swing EDT", "ให้ worker ทุกตัวใช้ BufferedReader จาก Socket ของ client รายแรก"], "a": 1, "e": "field current ถูกเขียนทับทุกครั้งที่ accept ใหม่ แต่ละงานต้องได้ Socket ของตัวเอง (เช่นส่งผ่าน constructor ของ handler)", "s": "pf"}, {"n": 9, "q": "ผู้พัฒนาต้องการนับทั้งจำนวนข้อมูลทั้งหมดและจำนวนค่าบวกจาก List เดียวกัน โดยใช้ Stream ในตัวแปร s นับจำนวนข้อมูลทั้งหมดด้วย count() ไปแล้ว หากต้องการนับค่าบวกต่อโดยไม่เปลี่ยนแปลง List ต้นทาง ควรใช้วิธีใด", "o": ["เรียก s.filter(n -> n > 0).count() ต่อจาก s.count()", "เรียก s.close() แล้วใช้ s.count() อีกครั้ง", "สร้าง pipeline ใหม่ด้วย values.stream().filter(n -> n > 0).count()", "กำหนด Stream<Integer> other = s แล้วใช้ other.filter(...).count()"], "a": 2, "e": "Stream ใช้ได้ครั้งเดียว หลัง terminal (count) แล้วใช้ต่อไม่ได้ ต้องสร้าง stream ใหม่จาก List", "s": "pf", "c": "List<Integer> values = List.of(-1, 2, 3);\nStream<Integer> s = values.stream();\nlong all = s.count();\n// ต้องคำนวณจำนวนค่าบวกต่อ"}, {"n": 10, "q": "คลาส Meter มี constructor สองแบบดังโค้ดด้านล่าง เมื่อสร้างออบเจ็กต์ด้วย new Meter() โดยไม่ส่งอาร์กิวเมนต์ constructor ใดเป็นผู้กำหนดค่าให้ field value และโปรแกรมจะพิมพ์ค่าใด", "o": ["constructor ที่รับ int เป็นผู้กำหนดค่าให้ field และโปรแกรมพิมพ์ 5", "constructor ที่ไม่รับอาร์กิวเมนต์กำหนดค่าให้ field เป็น 0 และโปรแกรมพิมพ์ 0", "constructor ทั้งสองสร้างออบเจ็กต์คนละตัว และโปรแกรมพิมพ์ 6", "คอมไพล์ไม่ผ่าน เพราะใช้ this(...) เรียก constructor ไม่ได้"], "a": 0, "e": "this(6) เรียก constructor ที่รับ int → value = 6 − 1 = 5", "s": "pf", "c": "class Meter {\n    int value;\n    Meter() { this(6); }\n    Meter(int value) { this.value = value - 1; }\n}\n// ภายใน main\nSystem.out.print(new Meter().value);"}, {"n": 11, "q": "เมธอด last ด้านล่างต้องรับสตริงที่ไม่ว่างและคืนอักขระตัวสุดท้าย แต่เมื่อเรียกใช้กับ \"route\" กลับเกิดข้อผิดพลาด หากแก้ได้เฉพาะนิพจน์ภายในวงเล็บของ charAt ควรเปลี่ยนเป็นนิพจน์ใด", "o": ["1 - text.length()", "text.length() + 1", "text.length()", "text.length() - 1"], "a": 3, "e": "ตัวสุดท้ายอยู่ index length() − 1", "s": "pf", "c": "static char last(String text) {\n    return text.charAt(text.length());\n}"}, {"n": 12, "q": "ผู้พัฒนาต้องการให้คลาสลูกเพิ่มความสามารถใหม่ได้ แต่ไม่อนุญาตให้เปลี่ยนวิธีคำนวณ checksum() ที่คลาสแม่กำหนดไว้ ควรใช้ final กับส่วนใดเพื่อจำกัดเฉพาะสิ่งที่ต้องการ", "o": ["ประกาศเมธอด checksum() ในคลาสแม่ให้เป็น final method", "ประกาศพารามิเตอร์ทุกตัวของ checksum() ให้เป็น final เท่านั้น", "ประกาศคลาสแม่ให้เป็น final class", "ประกาศตัวแปรที่อ้างอิงออบเจ็กต์ของคลาสแม่ใน main ให้เป็น final"], "a": 0, "e": "final method ห้ามคลาสลูก override แต่ยังเพิ่มเมธอดใหม่ได้ · final class จะห้ามสืบทอดเลย", "s": "pf"}, {"n": 13, "q": "ทีมพัฒนานำไฟล์ .class ที่คอมไพล์แล้วไปใช้บนคอมพิวเตอร์ที่มีสถาปัตยกรรมต่างจากเครื่องเดิม โปรแกรมไม่ได้ใช้ไลบรารี native และมี dependency ครบ แต่ JVM ของเครื่องปลายทางไม่รองรับรุ่นของไฟล์ .class นี้ ควรแก้ปัญหาอย่างไร", "o": ["เปลี่ยนชื่อเมธอด main ให้ตรงกับสถาปัตยกรรม CPU", "ใช้ JVM ที่รองรับไฟล์รุ่นนั้น หรือคอมไพล์ใหม่ให้ได้ bytecode รุ่นที่ JVM ปลายทางรองรับ", "เปลี่ยนนามสกุลไฟล์จาก .class เป็น .java เพื่อให้ JVM อ่านได้", "นำข้อความที่โปรแกรมเคยพิมพ์มาแทนเนื้อหาในไฟล์ .class"], "a": 1, "e": "bytecode ไม่ผูกกับ CPU แต่ผูกกับรุ่นของ JVM ต้องใช้ JVM ที่ใหม่พอ หรือคอมไพล์ให้ target รุ่นต่ำลง", "s": "pf"}, {"n": 14, "q": "เอกสารข้อกำหนดระบุว่า \"หน้าค้นหาต้องเร็วและรองรับผู้ใช้ได้มาก\" แต่ทีมทดสอบยังไม่สามารถใช้ข้อความนี้ตัดสินได้ว่าระบบผ่านเกณฑ์หรือไม่ ควรเพิ่มข้อมูลลักษณะใดเป็นหลักเพื่อให้ทดสอบและตัดสินผลได้ชัดเจน", "o": ["เปลี่ยนคำว่า \"เร็ว\" เป็น \"เร็วมาก\" โดยไม่เพิ่มตัวชี้วัด", "ระบุสีพื้นหลังและตำแหน่งโลโก้แทนเกณฑ์ประสิทธิภาพทั้งหมด", "ระบุรายชื่อผู้พัฒนาที่เขียนเมธอดค้นหา", "ระบุเกณฑ์เวลาตอบสนอง ภาระงาน และสภาพแวดล้อมที่ใช้วัดให้ชัดเจน"], "a": 3, "e": "requirement ต้องวัดผลได้: เวลาตอบสนอง จำนวนผู้ใช้ และสภาพแวดล้อมที่วัด", "s": "pf"}, {"n": 15, "q": "ในโค้ดด้านล่าง length รับ String แล้วคืน Integer ส่วน decorate รับ Integer แล้วคืน String หากต้องการใช้ฟังก์ชันทั้งสองแปลง \"kite\" ให้เป็น \"<4>\" ควรใช้นิพจน์ใด", "o": ["decorate.apply(\"kite\")", "decorate.apply(length.apply(\"kite\"))", "length.apply(4)", "length.apply(decorate.apply(\"kite\"))"], "a": 1, "e": "ทำ length ก่อน (\"kite\" → 4) แล้วส่งให้ decorate (4 → \"<4>\")", "s": "pf", "c": "Function<String, Integer> length = text -> text.length();\nFunction<Integer, String> decorate = n -> \"<\" + n + \">\";"}, {"n": 16, "q": "Domain Model ของระบบเช่าจักรยานมี Member และ Bicycle อยู่แล้ว ระบบต้องเก็บประวัติการเช่าจักรยานคันเดิมได้หลายครั้ง รวมถึงวันรับและวันคืนของการเช่าแต่ละครั้ง ควรเพิ่มแนวคิดใดลงใน Domain Model จึงจะเหมาะสมที่สุด", "o": ["เพิ่ม JFrame เพื่อแทนการเช่าแต่ละครั้ง", "เพิ่มชื่อไฟล์ Main.java เป็น conceptual class", "เพิ่ม Rental เพื่อแทนการเช่าแต่ละครั้ง แล้วเชื่อมโยงกับ Member และ Bicycle", "ใช้ชื่อปุ่มบนหน้าจอเก็บประวัติทั้งหมดแทนการเพิ่มแนวคิดเรื่องการเช่า"], "a": 2, "e": "การเช่าแต่ละครั้งเป็นแนวคิดในโดเมน มีวันรับ/คืนของตัวเอง จึงเป็น conceptual class Rental เชื่อม Member กับ Bicycle", "s": "pf"}, {"n": 17, "q": "ผู้พัฒนาประกาศ List ชื่อ labels ให้เก็บข้อมูลชนิด String เท่านั้นดังโค้ดด้านล่าง บรรทัดใดจะคอมไพล์ไม่ผ่านเนื่องจากใช้ชนิดข้อมูลไม่ตรงกับ generic type ที่กำหนด", "o": ["บรรทัด D", "บรรทัด A", "บรรทัด B", "บรรทัด C"], "a": 3, "e": "labels เป็น List<String> ใส่ int 25 ไม่ได้", "s": "pf", "c": "List<String> labels = new ArrayList<>(); // A\nlabels.add(\"rack\");                       // B\nlabels.add(25);                           // C\nString first = labels.get(0);             // D"}, {"n": 18, "q": "เมธอด addFraction(List<Number> values) เพิ่มค่าลงในรายการด้วยคำสั่ง values.add(2.5) สมมติว่า Java อนุญาตให้ส่ง List<Integer> เข้าเมธอดนี้ได้โดยตรง จะเกิดความเสี่ยงใดที่อธิบายได้ว่าเหตุใด Java จึงไม่อนุญาตให้ใช้ชนิดข้อมูลเช่นนี้", "o": ["List ที่ผู้เรียกคาดว่ามีเฉพาะ Integer อาจมี Double ถูกเพิ่มเข้ามาผ่านเมธอดนี้", "ขนาดของ List จะต้องกลายเป็นเลขทศนิยม", "สมาชิกชนิด Integer ทุกตัวจะต้องถูกลบก่อนเรียกเมธอด", "Integer จะเปลี่ยน superclass เป็น Double ระหว่างที่โปรแกรมทำงาน"], "a": 0, "e": "ถ้ายอมให้ส่งได้ เมธอดจะใส่ 2.5 (Double) ลงใน List ที่ผู้เรียกเชื่อว่ามีแต่ Integer · generics จึงเป็น invariant", "s": "pf"}, {"n": 19, "q": "ระบบคิดค่าบริการจากจำนวนชั่วโมงที่เป็นจำนวนเต็มและไม่ติดลบ โดย 0–2 ชั่วโมงไม่คิดค่าบริการ 3–5 ชั่วโมงคิดราคาลดพิเศษ และตั้งแต่ 6 ชั่วโมงขึ้นไปคิดราคาปกติ หากต้องการทดสอบค่าที่อยู่ติดกันทั้งสองด้านของจุดเปลี่ยนประเภทราคาทุกจุด ควรเลือกชุดข้อมูลใด", "o": ["0, 1, 4, 8", "2, 3, 5, 6", "0, 2, 4, 7", "3, 4, 6, 9"], "a": 1, "e": "จุดเปลี่ยนอยู่ระหว่าง 2|3 และ 5|6 ต้องทดสอบทั้งสองข้างของแต่ละจุด", "s": "pf"}, {"n": 20, "q": "ผู้พัฒนาต้องการใช้ Map<String,Integer> ชื่อ counts ซึ่งเริ่มต้นเป็น Map ว่าง เพื่อนับจำนวนครั้งที่แต่ละรหัสปรากฏในลูป เมื่อพบรหัสเดิมอีกครั้งต้องเพิ่มจำนวนที่นับไว้ ไม่ใช่กำหนดค่าเป็น 1 ซ้ำ ควรเติมคำสั่งใดในช่องว่าง", "o": ["counts.put(code, counts.size());", "counts.put(\"code\", counts.size() + 1);", "counts.put(code, 1);", "counts.put(code, counts.getOrDefault(code, 0) + 1);"], "a": 3, "e": "getOrDefault คืน 0 ถ้ายังไม่มี key แล้ว +1 · X ได้ 3", "s": "pf", "c": "Map<String, Integer> counts = new HashMap<>();\nfor (String code : List.of(\"X\", \"Y\", \"X\", \"X\")) {\n    /* เติมคำสั่ง */\n}\n// ต้องการ counts.get(\"X\") เป็น 3"}, {"n": 21, "q": "ทีมกำลังเขียน System Sequence Diagram (SSD) ของระบบจองกิจกรรม โดยมองระบบเป็นกล่องดำ ในสถานการณ์นี้ผู้ใช้เลือกกิจกรรม ระบุจำนวนที่นั่ง แล้วกดยืนยัน ข้อความใดเหมาะสมที่สุดที่จะใช้เป็น system event จาก Actor ไปยัง :System", "o": ["reservationRepository.insertRow(sql)", "databaseConnection.commit()", "reserveSeats(activityId, seatCount)", "button.setBackground(color)"], "a": 2, "e": "SSD มองระบบเป็นกล่องดำ system event ต้องเป็นภาษาของโดเมน ไม่ใช่ SQL หรือ UI", "s": "pf"}, {"n": 22, "q": "ผู้พัฒนาต้องการเขียนเมธอด last เพียงเมธอดเดียวให้ใช้ได้กับ List ที่มีชนิดสมาชิกต่างกัน โดยชนิดของค่าที่คืนในแต่ละครั้งต้องตรงกับชนิดสมาชิกของ List ที่ส่งเข้ามา ควรเติมส่วนประกาศใดลงในช่องว่าง", "o": ["T <T>", "void", "Object", "<T> T"], "a": 3, "e": "ประกาศ type parameter <T> หน้า return type T", "s": "pf", "c": "static /* เติมส่วนประกาศ */ last(List<T> values) {\n    return values.get(values.size() - 1);\n}\n// ถือว่า values ไม่ว่าง"}, {"n": 23, "q": "กำหนดให้ mode มีค่าเป็น 1 หรือ 2 เท่านั้น ผู้พัฒนาต้องการให้ level เป็น 10 เมื่อ mode เป็น 1 และให้ level เป็น 20 เมื่อ mode เป็น 2 แต่โค้ดด้านล่างกลับให้ level เป็น 20 แม้ mode จะเป็น 1 หากต้องการแก้เพียงจุดเดียว ควรแก้ไขอย่างไร", "o": ["เพิ่ม break; หลังคำสั่ง level = 10;", "ลบ break; ที่อยู่หลังคำสั่ง level = 20;", "เปลี่ยนค่าเริ่มต้นของ level จาก 0 เป็น 10;", "เพิ่ม default: level = 20; ไว้ท้าย switch"], "a": 0, "e": "ไม่มี break หลัง case 1 จึงตกต่อไป case 2 ทับเป็น 20", "s": "pf", "c": "int level = 0;\nswitch (mode) {\n    case 1: level = 10;\n    case 2: level = 20; break;\n}"}, {"n": 24, "q": "คลาส Key มีเพียง field ชื่อ id และ constructor โดยไม่ได้ override equals() ผู้ทดสอบสร้างออบเจ็กต์ด้วย new Key(8) สองครั้ง แล้วคาดว่าการเปรียบเทียบออบเจ็กต์ทั้งสองด้วย equals จะได้ true เพราะมี id เท่ากัน เหตุใดผลการทำงานปกติจึงไม่เป็นไปตามที่คาด", "o": ["equals ที่สืบทอดจาก Object ตรวจว่าเป็นออบเจ็กต์เดียวกันหรือไม่ โดยไม่ได้เปรียบเทียบค่าของทุก field ให้อัตโนมัติ", "equals ใช้ได้เฉพาะกับ String และใช้กับคลาสที่เขียนเองไม่ได้", "Java ไม่อนุญาตให้ออบเจ็กต์สองตัวมีค่าใน field id เท่ากัน", "constructor จะเปลี่ยน id ของออบเจ็กต์ตัวที่สองเพื่อไม่ให้ซ้ำกับตัวแรก"], "a": 0, "e": "equals ของ Object เทียบว่าเป็น object เดียวกัน (เหมือน ==) ต้อง override เองถ้าจะเทียบค่า", "s": "pf"}, {"n": 25, "q": "TextRenderer ใช้รูปแบบ Strategy โดยมี field ชื่อ policy สำหรับอ้างอิงวิธีจัดข้อความที่ใช้อยู่ เมื่อผู้ใช้เปลี่ยนจากการจัดข้อความชิดซ้ายเป็นการจัดกึ่งกลาง ทั้งสองวิธียังคงใช้ข้อตกลง LayoutPolicy เดียวกัน ควรเปลี่ยนส่วนใดขณะที่โปรแกรมกำลังทำงาน", "o": ["เปลี่ยน superclass ของ TextRenderer ขณะที่โปรแกรมกำลังทำงาน", "เปลี่ยนออบเจ็กต์ LayoutPolicy ที่ renderer อ้างถึง", "แก้ source code ของ TextRenderer แล้วคอมไพล์ใหม่ทุกครั้ง", "เขียน renderer ให้ตรวจชื่อ concrete policy ทุกแบบด้วย if ในทุกเมธอด"], "a": 1, "e": "Strategy สลับพฤติกรรมโดยเปลี่ยน object ที่ field policy อ้างถึง", "s": "pf"}, {"n": 26, "q": "ระบบจองที่นั่งอาจเปลี่ยนโครงสร้างข้อมูลและวิธีแทนสถานะที่นั่งภายในคลาสในอนาคต การออกแบบข้อใดจะทำให้การเปลี่ยนแปลงนี้ส่งผลกระทบต่อโค้ดที่เรียกใช้คลาสมากที่สุด", "o": ["ให้ผู้เรียกใช้ reserve(seatNo) แล้วรับผลว่าจองสำเร็จหรือไม่", "ให้ผู้เรียกแก้ public int[] rawSeats ได้โดยตรง และต้องรู้ว่า 0 หมายถึงว่าง ส่วน 1 หมายถึงจองแล้ว", "ให้ผู้เรียกตรวจสอบผ่าน isAvailable(seatNo) โดยไม่ต้องเห็นโครงสร้างข้อมูลภายใน", "ให้ public method ตรวจสอบหมายเลขที่นั่งก่อนแก้ไขข้อมูลภายใน"], "a": 1, "e": "เปิดโครงสร้างภายในให้ผู้เรียกแก้ตรง ๆ (ไม่มี encapsulation) เปลี่ยนภายในเมื่อไรผู้เรียกพังหมด", "s": "pf"}, {"n": 27, "q": "รายการ ids มีข้อมูล [6, 12, 18] ผู้พัฒนาต้องการลบสมาชิกที่มีค่ารหัส 12 จึงเขียน ids.remove(12) แต่กลับเกิด IndexOutOfBoundsException ควรเปลี่ยนคำสั่งเป็นข้อใดเพื่อลบสมาชิกตามค่าที่ต้องการ", "o": ["ids.remove(\"12\");", "ids.remove(12L);", "ids.remove(ids.size());", "ids.remove(Integer.valueOf(12));"], "a": 3, "e": "remove(int) คือลบตาม index ต้องส่ง Integer object เพื่อเรียก remove(Object)", "s": "pf"}, {"n": 28, "q": "ตัวแปร count ประกาศเป็น volatile int และเริ่มต้นที่ 9 โดยไม่มี synchronization อื่น เมื่อเธรด A และ B เรียก count++ เกิดลำดับการทำงานดังนี้: A อ่านค่า 9, B อ่านค่า 9, A เขียนค่า 10 และ B เขียนค่า 10 หลังจากจบลำดับนี้ count จะมีค่าเท่าใด และเหตุการณ์นี้แสดงปัญหาใด", "o": ["11 เพราะ volatile รวมผลจากการเพิ่มค่าทั้งสองครั้งให้อัตโนมัติ", "19 เพราะ volatile นำค่าที่อ่านได้ทั้งสองครั้งมาบวกกัน", "10 เพราะการเพิ่มค่าทั้งสองครั้งเขียนทับกันจนเกิด lost update แม้ field จะเป็น volatile", "ลำดับนี้เกิดขึ้นไม่ได้ เพราะ volatile ล็อกการทำงานของคำสั่ง count++ ทั้งคำสั่ง"], "a": 2, "e": "lost update: count++ คือ อ่าน-บวก-เขียน volatile รับประกันการมองเห็น แต่ไม่ทำให้ ++ เป็น atomic", "s": "pf"}, {"n": 29, "q": "ผู้พัฒนาพยายามแก้ปัญหาหน้าจอค้างขณะอ่านไฟล์ขนาดใหญ่ โดยเปลี่ยนไปเรียกงานผ่าน SwingUtilities.invokeLater(() -> loadLargeFile()) แต่หน้าจอยังคงไม่ตอบสนองระหว่างอ่านไฟล์ เหตุผลใดอธิบายปัญหานี้ได้ตรงที่สุด", "o": ["invokeLater ส่งงานไปทำบน EDT จึงไม่ได้เปลี่ยนงานนั้นให้เป็นงานเบื้องหลัง", "EDT ทำงานได้เฉพาะเมื่อไม่มี JFrame อยู่เลย", "โปรแกรม Swing ไม่สามารถอ่านไฟล์ขนาดใหญ่ได้ไม่ว่าในกรณีใด", "invokeLater ทำให้ Java หยุดทุกเธรดจนกว่าจะปิดโปรแกรม"], "a": 0, "e": "invokeLater ส่งงานไปรันบน EDT งานหนักจึงยังบล็อก EDT ต้องใช้ SwingWorker หรือ thread อื่น", "s": "pf"}, {"n": 30, "q": "ข้อมูลจากเซนเซอร์ใช้ค่าติดลบเป็นเครื่องหมายสิ้นสุดข้อมูล โปรแกรมต้องรวมเฉพาะค่าที่อ่านได้ก่อนพบเครื่องหมายนี้ และยังต้องพิมพ์ผลรวมหลังออกจากลูป ควรเติมคำสั่งใดลงในช่องว่าง", "o": [";", "return;", "continue;", "break;"], "a": 3, "e": "break ออกจากลูปแล้วยังพิมพ์ total (6) ได้ · return จะออกจากเมธอดโดยไม่พิมพ์ · continue จะบวก 9 ต่อ", "s": "pf", "c": "int total = 0;\nfor (int reading : new int[]{6, 0, -1, 9}) {\n    if (reading < 0) { /* เติมคำสั่ง */ }\n    total += reading;\n}\nSystem.out.print(total);"}, {"n": 31, "q": "แผนภาพด้านล่างใช้ลูกศรแทนความสัมพันธ์แบบ Dependency โดยลูกศรชี้จากคลาสที่ใช้งานไปยังคลาสที่ถูกใช้งาน หาก StatsService เปลี่ยน signature ของเมธอด public ที่ทั้งสองคลาสเรียกใช้ ควรตรวจสอบและแก้ไขคลาสใดก่อนในฐานะผู้พึ่งพาโดยตรง", "o": ["StatsService และ DataGateway เท่านั้น", "Dashboard เท่านั้น เพราะ ExportJob ไม่ใช่หน้าจอ", "DataGateway เท่านั้น", "Dashboard และ ExportJob"], "a": 3, "e": "ผู้พึ่งพาโดยตรงของ StatsService คือคลาสที่ลูกศรชี้เข้ามา: Dashboard และ ExportJob", "s": "pf", "c": "Dashboard  --ใช้--> StatsService\nExportJob  --ใช้--> StatsService\nStatsService --ใช้--> DataGateway"}, {"n": 32, "q": "คลาส Sensor เป็น public class และมีสมาชิกตามแผนภาพ UML ด้านล่าง หากคลาสที่ต้องการใช้งาน Sensor อยู่คนละ package และไม่ได้สืบทอดจาก Sensor คลาสนั้นจะเข้าถึงสมาชิกใดได้โดยตรง", "o": ["read()", "label()", "id", "ทั้ง id และ read()"], "a": 1, "e": "+ public เข้าได้ทุกที่ · # protected ต้องเป็นคลาสลูกหรือ package เดียวกัน · - private ไม่ได้", "s": "pf", "c": "Sensor\n- id: String\n# read(): int\n+ label(): String"}, {"n": 33, "q": "a และ b เป็น Thread ที่เพิ่งสร้างขึ้นเพื่อคำนวณงานคนละส่วน โปรแกรมต้องเปิดโอกาสให้ทั้งสองทำงานพร้อมกัน และเรียก combine() หลังจากทั้งสองทำงานเสร็จแล้ว หากไม่มี interrupt เกิดขึ้น ลำดับคำสั่งใดตรงตามความต้องการนี้มากที่สุด", "o": ["a.start(); b.start(); combine(); a.join(); b.join();", "a.start(); a.join(); b.start(); b.join(); combine();", "a.start(); b.start(); a.join(); b.join(); combine();", "a.join(); b.join(); combine(); a.start(); b.start();"], "a": 2, "e": "start ทั้งคู่เพื่อให้ทำพร้อมกัน แล้ว join รอทั้งคู่ก่อน combine", "s": "pf"}, {"n": 34, "q": "เมธอด price(int units) อ่านอัตราค่าบริการจากตัวแปร global ที่เปลี่ยนค่าได้ตลอดเวลา จึงอาจคำนวณราคาได้ต่างกันแม้รับ input เดิม หากต้องการปรับการคำนวณนี้ให้เป็น pure function ควรแก้ไขอย่างไร", "o": ["รับ rate เป็นพารามิเตอร์ แล้วคืนค่า units * rate โดยไม่อ่านหรือแก้ไข state ภายนอก", "เพิ่ม System.out.println(rate) ก่อนคืนผล เพื่อแสดงค่าของตัวแปร global", "เปลี่ยนเมธอดให้เป็น static แต่ยังอ่านตัวแปร global ตัวเดิม", "เพิ่มค่าตัวนับ global ทุกครั้งที่คำนวณ เพื่อบันทึกจำนวนครั้งที่เรียกใช้งาน"], "a": 0, "e": "pure function: ผลขึ้นกับ input เท่านั้น และไม่มีผลข้างเคียง", "s": "pf"}, {"n": 35, "q": "ผู้พัฒนาต้องการ override เมธอด save(String) แต่เปลี่ยนชนิดพารามิเตอร์เป็น Object ดังโค้ดด้านล่าง ในกรณีนี้ @Override ช่วยตรวจพบปัญหาใด", "o": ["เมธอดที่คืนค่าเป็น void ไม่สามารถใช้ @Override ได้", "save(Object) ไม่ได้ override save(String) เพราะชนิดพารามิเตอร์ไม่ตรงกัน", "ไม่สามารถใช้ Object เป็นชนิดพารามิเตอร์ของเมธอดได้", "เมธอดในคลาสลูกต้องมีชื่อต่างจากเมธอดในคลาสแม่เสมอ"], "a": 1, "e": "เปลี่ยนชนิดพารามิเตอร์ = overloading ไม่ใช่ overriding @Override จึงแจ้ง error ตอนคอมไพล์", "s": "pf", "c": "class Storage { void save(String text) { } }\nclass LocalStorage extends Storage {\n    @Override void save(Object text) { }\n}"}, {"n": 36, "q": "โปรแกรมต้องเก็บค่าทิศทาง โดยยอมรับเฉพาะ NORTH, SOUTH, EAST และ WEST และต้องการให้ compiler ช่วยป้องกันการกำหนดค่าที่ไม่อยู่ในชุดนี้ ควรเลือกวิธีใดจึงจะเหมาะสมที่สุด", "o": ["ใช้ Object direction เพื่อให้กำหนดออบเจ็กต์ชนิดใดก็ได้", "ใช้ public String direction และอนุญาตให้กำหนดข้อความใดก็ได้", "ประกาศ enum Direction แล้วกำหนดให้ field direction มีชนิดเป็น Direction", "ใช้ int direction โดยไม่กำหนดว่าตัวเลขแต่ละค่าหมายถึงทิศทางใด"], "a": 2, "e": "enum จำกัดค่าที่เป็นไปได้ compiler ตรวจให้", "s": "pf"}, {"n": 37, "q": "ระบบใช้รูปแบบ Observer โดยส่งการแจ้งเตือนเฉพาะผู้ที่ยังสมัครรับข้อมูลอยู่ เริ่มต้นมี Screen และ Log สมัครไว้ จากนั้นระบบยกเลิกการสมัครของ Screen และเพิ่ม Alarm ก่อนส่ง event ถัดไป หากรายชื่อผู้รับไม่เปลี่ยนระหว่างการแจ้งเตือน ผู้ใดควรได้รับ event นี้", "o": ["Screen, Log และ Alarm", "Screen และ Alarm", "Screen และ Log", "Log และ Alarm"], "a": 3, "e": "Screen ยกเลิกแล้ว · Log ยังอยู่ · Alarm เพิ่งสมัคร → Log และ Alarm", "s": "pf"}, {"n": 38, "q": "Thread a กำลังทำงานอยู่ในบล็อก synchronized(lock) และเรียก Thread.sleep(500) โดยยังไม่ออกจากบล็อก ระหว่างนั้น Thread b พยายามเข้าบล็อก synchronized(lock) ที่ใช้ lock ออบเจ็กต์เดียวกัน ข้อใดอธิบายสิ่งที่เกิดขึ้นได้ถูกต้อง", "o": ["a ต้องออกจากบล็อก synchronized ก่อน จึงจะเรียก sleep ได้ถูกต้องตามไวยากรณ์", "lock จะเปลี่ยนเป็น null โดยอัตโนมัติระหว่างที่ a เรียก sleep", "b ยังเข้าบล็อกไม่ได้ เพราะการเรียก sleep ไม่ได้ปล่อย monitor ที่ a ถืออยู่", "b เข้าบล็อกได้ทันทีเสมอ เพราะ sleep ปล่อย monitor ทุกตัวที่ a ถืออยู่"], "a": 2, "e": "sleep() ไม่ปล่อย monitor (lock) ต่างจาก wait()", "s": "pf"}, {"n": 39, "q": "คลาส Base อยู่ใน package core และประกาศ protected int value ส่วนคลาส Child extends Base อยู่ใน package feature ภายในเมธอดของ Child สามารถใช้ this.value ได้ แต่คลาส Viewer ที่อยู่ใน feature และไม่ได้สืบทอดจาก Base กลับใช้ child.value ไม่ได้ ข้อใดอธิบายเหตุผลได้ถูกต้อง", "o": ["การเข้าถึงสมาชิก protected จากต่าง package อนุญาตในบริบทของ subclass ไม่ได้ให้สิทธิ์แก่ทุกคลาสที่อยู่ package เดียวกับ subclass", "ทุกคลาสใน feature ถือว่าสืบทอดจาก Base โดยอัตโนมัติ", "สมาชิก protected ใช้ได้เฉพาะภายใน Base จึงไม่ควรอนุญาตให้ Child ใช้ this.value เช่นกัน", "เมื่อมี subclass แล้ว สมาชิก protected จะกลายเป็น public และเข้าถึงได้จากทุกที่"], "a": 0, "e": "protected ข้าม package ใช้ได้ผ่านการสืบทอดในคลาสลูกเท่านั้น คลาสอื่นใน package ของลูกไม่ได้สิทธิ์ด้วย", "s": "pf"}, {"n": 40, "q": "การทดสอบที่เรียก fee(true) อาจทำให้โปรแกรมทำงานผ่านทุกบรรทัดของเมธอดด้านล่าง แต่ยังไม่ได้ตรวจสอบกรณีที่ผู้ใช้ไม่เป็นสมาชิก ควรเพิ่ม assertion ใดเพื่อทดสอบพฤติกรรมที่ยังขาดอยู่", "o": ["assertEquals(5, fee(true)); ซ้ำอีกครั้ง โดยไม่เพิ่ม input ใหม่", "assertEquals(10, 10); โดยไม่เรียกใช้ fee", "assertTrue(true);", "assertEquals(10, fee(false));"], "a": 3, "e": "ต้องทดสอบกรณี member = false ด้วย ซึ่งควรได้ 10 · coverage เต็มไม่ได้แปลว่าตรวจครบทุกพฤติกรรม", "s": "pf", "c": "static int fee(boolean member) {\n    int amount = 10;\n    if (member) {\n        amount = 5;\n    }\n    return amount;\n}"}, {"n": 41, "q": "โปรแกรมสร้าง Executors.newFixedThreadPool(2) แล้วส่งงานอิสระห้างานเข้าไป โดยงานทั้งห้าใช้เฉพาะ worker ของ pool นี้ หากไม่ทราบระยะเวลาที่แต่ละงานใช้ ข้อใดสรุปได้ถูกต้อง", "o": ["งานที่สามจะถูกปฏิเสธเสมอ เพราะ pool รองรับงานทั้งหมดได้เพียงสองงาน", "งานทั้งห้าต้องเริ่มและจบพร้อมกัน", "ใน pool นี้จะมีงานที่กำลังทำบน worker ได้ไม่เกินสองงานพร้อมกัน ส่วนงานที่เหลือต้องรอให้ worker ว่าง", "JVM ต้องสร้าง worker ห้าตัวทันที เพราะมีงานทั้งหมดห้างาน"], "a": 2, "e": "fixed pool 2 ตัว ทำได้พร้อมกันไม่เกิน 2 งาน ที่เหลือรอคิว ไม่ถูกปฏิเสธ", "s": "pf"}, {"n": 42, "q": "Thread a เรียก print(\"1\") แล้วจึงเรียก print(\"2\") ส่วน Thread b เรียก print(\"A\") แล้วจึงเรียก print(\"B\") โปรแกรมเริ่มทั้งสองด้วย start() และรอจนทำงานเสร็จ โดยไม่มีคำสั่งพิมพ์อื่น หากแต่ละ print พิมพ์อักขระหนึ่งตัว ลำดับผลลัพธ์ใดเป็นไปไม่ได้", "o": ["A12B", "12AB", "A1B2", "21AB"], "a": 3, "e": "ใน thread a ต้องพิมพ์ 1 ก่อน 2 เสมอ ลำดับที่ 2 มาก่อน 1 จึงเป็นไปไม่ได้", "s": "pf"}, {"n": 43, "q": "AuditJob รับ Clock ผ่านพารามิเตอร์เพื่อใช้สร้างเวลาสำหรับบันทึกข้อมูล โดยไม่เก็บ Clock เป็น field และไม่มีความสัมพันธ์แบบ whole–part หากต้องการแสดงเพียงว่า AuditJob ใช้งาน Clock ควรวาดเส้นความสัมพันธ์ชนิดใด และให้ลูกศรชี้ไปทางใด", "o": ["เส้นทึบที่มีหัวสามเหลี่ยมโปร่ง ชี้จาก AuditJob ไปยัง Clock", "เส้นประที่มีหัวลูกศรธรรมดา ชี้จาก AuditJob ไปยัง Clock", "เส้นทึบที่มีสัญลักษณ์เพชรทึบอยู่ฝั่ง Clock", "เส้นประที่มีหัวลูกศรธรรมดา ชี้จาก Clock ไปยัง AuditJob"], "a": 1, "e": "ใช้ชั่วคราวผ่านพารามิเตอร์ = Dependency: เส้นประหัวลูกศรเปิด ชี้จากผู้ใช้ (AuditJob) ไปผู้ถูกใช้ (Clock)", "s": "pf", "c": "class AuditJob {\n    String stamp(Clock clock) { return clock.now(); }\n}\n// Clock มีเมธอด String now()"}, {"n": 44, "q": "ระบบตรวจสอบชื่อย่อด้วย String.matches(\"[a-z][a-z0-9]{2,4}\") ข้อมูลคู่ใดมีทั้งสองค่าผ่านเงื่อนไขนี้", "o": ["\"9az\" และ \"robot\"", "\"a9z\" และ \"robot\"", "\"a9z\" และ \"Robot\"", "\"a9\" และ \"robot\""], "a": 1, "e": "ต้องขึ้นต้นด้วย a-z ตามด้วย a-z/0-9 อีก 2–4 ตัว (ยาว 3–5): 9az ขึ้นต้นด้วยเลข, Robot พิมพ์ใหญ่, a9 สั้นไป", "s": "pf"}, {"n": 45, "q": "โปรแกรมด้านล่างเรียก audit จาก main แล้วทำงานต่อ เมื่อโค้ดทั้งหมดทำงานเสร็จ ข้อความที่พิมพ์ต่อกันจะเป็นอะไร", "o": ["4Y", "4XY", "49XY", "4"], "a": 0, "e": "พิมพ์ 4 แล้วเจอ 0 จึง return ออกจาก audit (ไม่พิมพ์ X) แล้ว main พิมพ์ Y", "s": "pf", "c": "static void audit(int[] values) {\n    for (int n : values) {\n        if (n == 0) return;\n        System.out.print(n);\n    }\n    System.out.print(\"X\");\n}\n// ภายใน main\naudit(new int[]{4, 0, 9});\nSystem.out.print(\"Y\");"}, {"n": 46, "q": "ข้อกำหนดระบุว่า countPositive ต้องนับเฉพาะจำนวนที่มากกว่า 0 แต่โค้ดด้านล่างกลับใช้เงื่อนไข >= 0 เมื่อใช้ assertEquals(expected, actual) การทดสอบใดจะล้มเหลวและแสดงข้อผิดพลาดนี้ได้โดยตรง", "o": ["assertEquals(2, countPositive(new int[]{2, 5}));", "assertEquals(2, countPositive(new int[]{0, 2, 5}));", "assertEquals(0, countPositive(new int[]{-3, -1}));", "assertEquals(1, countPositive(new int[]{-3, 5}));"], "a": 1, "e": "มี 0 จึงเห็นความต่าง: คาด 2 แต่โค้ดผิดนับได้ 3", "s": "pf", "c": "static int countPositive(int[] values) {\n    int count = 0;\n    for (int n : values) {\n        if (n >= 0) count++;\n    }\n    return count;\n}"}, {"n": 47, "q": "ภายใน ActionListener ผู้พัฒนาเรียก worker.execute() แล้วเรียก worker.get() ทันทีเพื่อนำผลไปแสดงใน JLabel แต่การทำงานเบื้องหลังใช้เวลานาน ควรแก้ไขอย่างไรเพื่อไม่ให้ EDT ต้องรอผลอยู่ใน listener", "o": ["อ่านผลด้วย get() และอัปเดต JLabel ภายใน done() พร้อมจัดการ exception ที่เกี่ยวข้อง", "เปลี่ยนจาก execute() เป็นการเรียก doInBackground() โดยตรงใน listener", "เพิ่ม Thread.sleep() บน EDT ก่อนเรียก get()", "ย้ายงานเครือข่ายทั้งหมดไปทำภายใน done() แทน"], "a": 0, "e": "get() บล็อกจนงานเสร็จ ต้องเรียกใน done() ซึ่งรันบน EDT หลังงานเบื้องหลังเสร็จ", "s": "pf"}, {"n": 48, "q": "ในโค้ดด้านล่าง printName เป็นเมธอด static แต่ name เป็นข้อมูลเฉพาะของพนักงานแต่ละออบเจ็กต์ หากต้องการแก้ให้โค้ดทำงานได้โดยยังเก็บชื่อของพนักงานแต่ละคนแยกกัน ควรแก้ไขอย่างไร", "o": ["เปลี่ยน printName ให้เป็น instance method แล้วเรียกผ่านออบเจ็กต์ของพนักงาน", "เปลี่ยน name ให้เป็น static เพื่อให้พนักงานทุกคนใช้ชื่อเดียวกัน", "เปลี่ยน this.name เป็น Employee.this.name ภายในเมธอด static", "เพิ่ม final ให้ name และยังคงใช้ this ภายในเมธอด static"], "a": 0, "e": "static method ไม่มี this ต้องเป็น instance method จึงใช้ name ของแต่ละ object ได้", "s": "pf", "c": "class Employee {\n    String name;\n    static void printName() { System.out.print(this.name); }\n}"}, {"n": 49, "q": "Design Class Diagram ระบุ operation เป็น + remaining(): int แต่โค้ดที่เขียนจริงกลับเป็น private void remaining() { ... } หากต้องคงชื่อและพารามิเตอร์เดิมไว้ ควรแก้ไขสองส่วนใดให้ตรงกับแผนภาพ", "o": ["คงชนิดคืนค่าเป็น void แล้วเพิ่ม final", "เปลี่ยนระดับการเข้าถึงเป็น protected และชนิดคืนค่าเป็น String", "เปลี่ยนระดับการเข้าถึงเป็น public และชนิดคืนค่าเป็น int", "คงระดับการเข้าถึงเป็น private แล้วเพิ่ม static"], "a": 2, "e": "+ = public และ : int = คืนค่า int", "s": "pf"}, {"n": 50, "q": "โค้ดด้านล่างเรียก run() โดยตรงแทนการเรียก start() โปรแกรมจะพิมพ์ค่า boolean ใด และเพราะเหตุใด", "o": ["false เพราะ new Thread เริ่มทำงานทันทีที่สร้างออบเจ็กต์", "true เพราะงานยังทำอยู่บน thread เดียวกับที่กำหนดค่าให้ตัวแปร caller", "คอมไพล์ไม่ผ่าน เพราะ Thread.currentThread() คืนค่าเป็น Runnable", "false เพราะการเรียกเมธอดใด ๆ ของ Thread จะสร้าง thread ใหม่เสมอ"], "a": 1, "e": "run() ตรง ๆ ทำงานบน thread ปัจจุบัน currentThread() จึงเป็น caller → true", "s": "pf", "c": "Thread caller = Thread.currentThread();\nThread task = new Thread(() ->\n    System.out.print(Thread.currentThread() == caller));\ntask.run();"}, {"n": 51, "q": "โปรแกรมเล่นเสียงต้องรองรับตัวถอดรหัสหลายชนิด ผู้ออกแบบกำลังพิจารณาว่าควรเปิดให้ผู้เรียกใช้งานผ่านสัญญาแบบใด ข้อใดแสดงการใช้ abstraction ได้เหมาะสมที่สุด", "o": ["ให้ผู้เรียกกำหนดค่าในทุก field ภายในตัวถอดรหัสด้วยตนเอง", "ให้ผู้เรียกคัดลอก algorithm ของตัวถอดรหัสทุกชนิดไปไว้ในส่วนหน้าจอ", "ให้ decode(data) คืนข้อมูลเสียง โดยผู้เรียกไม่ต้องจัดการตารางข้อมูลและขั้นตอนภายในตัวถอดรหัส", "เปิดเผยตำแหน่งหน่วยความจำภายใน แทนการจัดเตรียมเมธอดสำหรับใช้งาน"], "a": 2, "e": "abstraction: ผู้เรียกใช้ผ่านสัญญาง่าย ๆ (decode) ไม่ต้องรู้รายละเอียดภายใน", "s": "pf"}, {"n": 52, "q": "คลาส Badge ในโค้ดด้านล่างมีเมธอด code() และไม่ได้ระบุ extends Object ไว้โดยตรง เพราะเหตุใดคำสั่งบรรทัดสุดท้ายจึงคอมไพล์ไม่ผ่าน", "o": ["ตัวแปรชนิด Object เก็บ reference ได้เฉพาะออบเจ็กต์ที่สร้างด้วย new Object()", "ตัวแปรชนิด Object เก็บ reference ของ Badge ได้ แต่ชนิดของตัวแปร ref ไม่ได้ประกาศเมธอด code()", "การกำหนดออบเจ็กต์ให้ตัวแปรชนิด Object ทำให้เมธอดของ Badge ถูกลบออกจากออบเจ็กต์จริง", "Badge ไม่ได้สืบทอดจาก Object เพราะไม่ได้เขียน extends ไว้เอง"], "a": 1, "e": "compiler ดูชนิดของตัวแปร (Object) ซึ่งไม่มี code() แม้ object จริงเป็น Badge · ต้อง cast หรือประกาศเป็น Badge", "s": "pf", "c": "class Badge { String code() { return \"B7\"; } }\n// ภายใน main\nObject ref = new Badge();\nSystem.out.print(ref.code());"}, {"n": 53, "q": "RemoteStartButton ต้องใช้เพียงเมธอด start() แต่ปัจจุบันต้องพึ่ง MegaDevice ซึ่งมีทั้ง start(), calibrate() และ exportLogs() หากปรับการออกแบบตามหลัก ISP ปุ่มนี้ควรรับ dependency ชนิดใด", "o": ["Startable ที่เปิดให้ใช้เฉพาะ start() ซึ่งเป็นความสามารถที่ปุ่มนี้ต้องการ", "MegaDevice เช่นเดิม โดยให้เมธอดที่ไม่ได้ใช้โยน exception ทุกครั้ง", "MegaDevice ที่เพิ่มเมธอดให้ครอบคลุมอุปกรณ์ทุกชนิดในอนาคต", "Object แล้วให้ปุ่มตรวจเดาเองว่าออบเจ็กต์นั้นมีเมธอดใดบ้าง"], "a": 0, "e": "ISP: พึ่งเฉพาะ interface เล็กที่มีเมธอดที่ใช้จริง", "s": "pf"}, {"n": 54, "q": "การทดสอบนี้ใช้ JUnit Jupiter และ import Assertions ที่จำเป็นครบถ้วน โดย reserve(0) โยน IllegalArgumentException ตามข้อกำหนด หากไม่มีข้อผิดพลาดอื่น การทดสอบด้านล่างควรให้ผลอย่างไร", "o": ["ล้มเหลวเสมอ เพราะการทดสอบไม่อนุญาตให้เกิด exception ไม่ว่ากรณีใด", "ผ่าน เพราะ lambda โยน exception ชนิดที่ assertThrows คาดไว้", "ผ่านเฉพาะเมื่อ reserve(0) ไม่โยน exception", "คอมไพล์ไม่ผ่าน เพราะ assertThrows ใช้กับ lambda ไม่ได้"], "a": 1, "e": "assertThrows ผ่านเมื่อ lambda โยน exception ตามชนิดที่คาด", "s": "pf", "c": "assertThrows(IllegalArgumentException.class, () -> reserve(0));"}, {"n": 55, "q": "โมเดลกำหนดให้ Puzzle กับ Piece มีความสัมพันธ์แบบ Composition โดย Puzzle เป็น whole และ Piece เป็น part ซึ่งออบเจ็กต์หนึ่งเป็นส่วนประกอบของ whole ได้ไม่เกินหนึ่งออบเจ็กต์ในเวลาเดียวกัน ข้อมูลชุดใดขัดกับโมเดลนี้โดยตรง", "o": ["Piece ถูกนำออกจาก Puzzle เดิมก่อน แล้วจึงนำไปเป็น part ของ Puzzle อีกออบเจ็กต์หนึ่ง", "Puzzle สองออบเจ็กต์มี Piece คนละออบเจ็กต์กัน แต่ชิ้นส่วนเหล่านั้นมีลวดลายเหมือนกัน", "Piece ออบเจ็กต์เดียวกันเป็นส่วนประกอบของ Puzzle สองออบเจ็กต์ในเวลาเดียวกัน", "Puzzle สองออบเจ็กต์มีจำนวน Piece ต่างกัน โดยโมเดลไม่ได้กำหนด multiplicity เพิ่มเติม"], "a": 2, "e": "composition: part หนึ่งชิ้นเป็นของ whole ได้ตัวเดียวในเวลาเดียวกัน", "s": "pf"}, {"n": 56, "q": "สัญญาของ Sorter ระบุว่าเมธอด sort รับ List ว่างได้และต้องคืน List ว่าง แต่ NonEmptySorter ซึ่งเป็น subtype กลับโยน exception เมื่อได้รับ List ว่าง การทดสอบใดแสดงปัญหาการใช้แทนกันตามหลัก LSP ได้ตรงที่สุด", "o": ["เปรียบเทียบความยาวของชื่อคลาส Sorter และ NonEmptySorter", "ใช้ NonEmptySorter ผ่านตัวแปรชนิด Sorter แล้วเรียก sort ด้วย List ว่างตามที่สัญญาเดิมอนุญาต", "ตรวจสอบว่า NonEmptySorter อยู่ใน package เดียวกับ Sorter หรือไม่", "เรียก sort ด้วยข้อมูลสามตัวที่เรียงลำดับแล้วเท่านั้น"], "a": 1, "e": "LSP ทดสอบโดยใช้ subtype แทน supertype ในกรณีที่สัญญาเดิมอนุญาต แล้วดูว่าพังหรือไม่", "s": "pf"}, {"n": 57, "q": "แผนภาพ DSD แสดงการเรียกเมธอดตามลำดับด้านล่าง หากต้องเพิ่มเมธอด finish(returnDate) ให้ตรงกับผู้รับข้อความในแผนภาพ ควรเพิ่มเมธอดนี้ในคลาสใด", "o": ["ReturnService", "returnDate", "RentalPanel", "Rental"], "a": 3, "e": "ข้อความใน DSD เป็นเมธอดของผู้รับ: rental:Rental", "s": "pf", "c": "panel:RentalPanel -> service:ReturnService : returnBike(rentalId, returnDate)\nservice:ReturnService -> rental:Rental : finish(returnDate)"}, {"n": 58, "q": "ระบบต้องเก็บความสัมพันธ์ระหว่าง Artist กับ Gallery ที่เคยร่วมจัดนิทรรศการ เพื่อให้เรียกดูประวัติการร่วมงานได้ โดยทั้งสองฝ่ายไม่ได้เป็นส่วนประกอบของกันและกันและไม่มีการสืบทอด ควรใช้ความสัมพันธ์พื้นฐานชนิดใดในโมเดล", "o": ["Realization", "Generalization", "Association", "Composition"], "a": 2, "e": "รู้จักและเก็บความสัมพันธ์กันแต่ไม่ใช่ whole-part หรือสืบทอด = Association", "s": "pf"}, {"n": 59, "q": "โค้ดด้านล่างคอมไพล์ผ่านด้วย javac แล้ว ผู้พัฒนาจึงกล่าวว่าไม่จำเป็นต้องทดสอบอีก เพราะ compiler ตรวจสอบปัญหาทั้งหมดให้แล้ว สิ่งที่จะเกิดขึ้นในข้อใดแสดงว่าคำกล่าวนี้ไม่ถูกต้อง", "o": ["JVM จะเปลี่ยนตัวหารเป็น 1 ให้โดยอัตโนมัติ", "javac ต้องปฏิเสธโค้ดนี้ก่อนสร้างไฟล์ .class เสมอ", "โปรแกรมจะพิมพ์ Infinity เพราะตัวแปรมีชนิดเป็น int", "โปรแกรมจะเกิด ArithmeticException เมื่อทำงานถึงคำสั่ง .1", "ปลายฝั่ง Staff เป็น 0..1 และปลายฝั่ง Locker เป็น 0..2", "ปลายฝั่ง Staff เป็น 1 และปลายฝั่ง Locker เป็น 2"], "a": 2, "e": "ปลาย Staff = จำนวนพนักงานต่อหนึ่งตู้ (0..1) · ปลาย Locker = จำนวนตู้ต่อหนึ่งคน (0..2)", "s": "pf"}, {"n": 67, "q": "คลาส Roster เก็บรายชื่อไว้ในฟิลด์ private แต่เมธอด getNames() คืน List ที่ใช้เก็บข้อมูลภายในโดยตรง ผู้เรียกจึงใช้ getNames().clear() ล้างรายชื่อได้โดยไม่ผ่านกฎของ Roster แนวทางใดแก้ปัญหานี้ได้ตรงจุดที่สุด", "o": ["เพิ่ม setter ที่รับ List ใดก็ได้ แล้วเก็บค่าการอ้างอิงนั้นไว้ทันที", "เปลี่ยนชื่อฟิลด์จาก names เป็น hiddenNames", "คืนสำเนาของ List และกำหนดให้การแก้ไขข้อมูลจริงต้องผ่านเมธอดที่ตรวจสอบเงื่อนไข", "ประกาศตัวแปรอ้างอิงของ List เป็น final เพียงอย่างเดียว"], "a": 2, "e": "คืน reference ภายในเท่ากับเปิด field ให้แก้ตรง ควรคืนสำเนา (หรือ unmodifiable) แล้วให้แก้ผ่านเมธอด", "s": "pf"}, {"n": 68, "q": "เซิร์ฟเวอร์ส่งอักขระตามลำดับ \"OK\\n\\n\" แล้วปิดการส่งข้อมูลตามปกติ โดยข้อมูลส่งถึงไคลเอนต์ครบทั้งหมด หากไคลเอนต์เรียก readLine() ติดต่อกันสามครั้ง จะได้รับค่าตามลำดับใด", "o": ["\"OK\\n\", \"\\n\", \"\"", "\"OK\", \"\", null", "\"OK\", \"\", \"\"", "\"OK\", null, null"], "a": 1, "e": "readLine ตัด \\n ออก: \"OK\" แล้วบรรทัดว่าง \"\" แล้วจบ stream ได้ null", "s": "pf"}, {"n": 69, "q": "ผู้ใช้พิมพ์ \" 42 \" ลงใน JTextField ผู้พัฒนาต้องการอ่านค่านี้เป็น int ที่มีค่า 42 แต่ใช้ String.valueOf(field) แล้วได้ข้อความอธิบายคอมโพเนนต์แทน ควรใช้นิพจน์ใดเพื่ออ่านและแปลงค่าที่ผู้ใช้กรอก", "o": ["Integer.parseInt(field.toString())", "Integer.parseInt(field.getName())", "Integer.parseInt(String.valueOf(field))", "Integer.parseInt(field.getText().trim())"], "a": 3, "e": "getText() อ่านข้อความที่ผู้ใช้พิมพ์ trim() ตัดช่องว่างก่อน parseInt", "s": "pf"}, {"n": 70, "q": "จากโค้ดด้านล่าง คำสั่ง new Pass(3) สามารถใช้คอนสตรักเตอร์และเมธอดที่เขียนไว้ในคลาส abstract ได้หรือไม่ และโปรแกรมจะพิมพ์ผลลัพธ์ใด", "o": ["ได้ และพิมพ์ 3", "ไม่ได้ เพราะคลาสลูกไม่สามารถเรียก super(...) ของคลาส abstract ได้", "ได้ แต่พิมพ์ 0 เพราะฟิลด์ของคลาส abstract ไม่ได้รับการกำหนดค่า", "ไม่ได้ เพราะคลาส abstract ไม่สามารถมีคอนสตรักเตอร์ได้"], "a": 0, "e": "abstract class มี constructor ได้ คลาสลูกเรียกผ่าน super(3) และใช้เมธอดปกติของแม่ได้ → 3", "s": "pf", "c": "abstract class Token {\n    private int number;\n    Token(int number) { this.number = number; }\n    int number() { return number; }\n    abstract boolean valid();\n}\nclass Pass extends Token {\n    Pass(int number) { super(number); }\n    boolean valid() { return true; }\n}\n// ภายใน main\nSystem.out.print(new Pass(3).number());"}, {"n": 71, "q": "โพรโทคอลกำหนดให้ข้อมูลหนึ่งชุดมีความยาว 8 ไบต์ แต่การเรียก in.read(buffer) ครั้งแรกคืนค่า 3 ทั้งที่ยังไม่ถึงจุดสิ้นสุดของสตรีม (EOF) ผู้พัฒนาควรจัดการอย่างไรเพื่อไม่ให้นำข้อมูลที่ยังไม่ครบชุดไปใช้งาน", "o": ["เติมห้าไบต์ที่ขาดด้วยศูนย์ แล้วถือว่าเป็นข้อมูลที่ได้รับจากเซิร์ฟเวอร์", "ถือว่าสามไบต์ที่อ่านได้เป็นข้อมูลครบหนึ่งชุดเสมอ", "สรุปว่า TCP ทำข้อมูลสูญหาย เพราะการอ่านหนึ่งครั้งต้องได้ข้อมูลเท่ากับการเขียนหนึ่งครั้ง", "อ่านต่อและสะสมจำนวนไบต์จนได้ครบ 8 ไบต์ หรือจัดการกรณีที่พบ EOF หรือข้อผิดพลาดก่อนอ่านครบ"], "a": 3, "e": "read() อาจได้ข้อมูลไม่ครบในครั้งเดียว (TCP เป็น stream) ต้องวนอ่านจนครบหรือเจอ EOF", "s": "pf"}, {"n": 72, "q": "เดิม Use Case Diagram แสดง NotificationService เป็นบริการภายนอกที่โต้ตอบกับระบบ ต่อมาทีมขยายขอบเขตของระบบที่กำลังวิเคราะห์ให้ครอบคลุม NotificationService ด้วย เมื่อใช้ขอบเขตใหม่นี้ ควรพิจารณาบทบาทของบริการดังกล่าวในแผนภาพอย่างไร", "o": ["ไม่ควรแสดงบริการที่ย้ายเข้ามาอยู่ภายในขอบเขตระบบแล้วเป็น actor ภายนอกของระบบเดียวกัน", "ต้องเปลี่ยนทุกเมธอดใน NotificationService ให้เป็น actor ใหม่", "ขอบเขตระบบไม่มีผลต่อการแยกองค์ประกอบภายในออกจาก actor", "ต้องแสดงเป็น actor ภายนอกตลอดไป เพราะเคยวาดไว้นอกกรอบระบบแล้ว"], "a": 0, "e": "สิ่งที่อยู่ในขอบเขตระบบไม่ใช่ actor · actor ต้องอยู่นอก system boundary", "s": "pf"}, {"n": 73, "q": "เซิร์ฟเวอร์รับการเชื่อมต่อจาก Alice ไว้ใน Socket a และรับการเชื่อมต่อจาก Bob ไว้ใน Socket b หากเซิร์ฟเวอร์เขียนข้อมูลลงในสตรีมขาออกของ a เพียงตัวเดียว เหตุใด Bob จึงไม่ได้รับข้อความนั้นโดยอัตโนมัติ", "o": ["Socket แต่ละตัวใช้กับการเชื่อมต่อของตนเอง หากต้องการส่งให้ทุกคนต้องเขียนข้อมูลไปยังแต่ละการเชื่อมต่อ", "เพราะ TCP กำหนดให้ไคลเอนต์ที่ชื่อ Bob ต้องใช้ UDP เท่านั้น", "เพราะการเรียก accept() ครั้งที่สองจะยกเลิกการสื่อสารของ Alice เสมอ", "เพราะ ServerSocket ส่งข้อมูลให้ได้เฉพาะไคลเอนต์รายแรกตลอดอายุการทำงานของโปรแกรม"], "a": 0, "e": "แต่ละ Socket คือการเชื่อมต่อหนึ่งราย ต้องเขียนส่งให้ทุก socket เอง (broadcast)", "s": "pf"}, {"n": 74, "q": "โปรแกรมด้านล่างดึงข้อความที่อยู่หลังเครื่องหมาย = ตัดช่องว่างที่หัวและท้ายข้อความ แล้วเปลี่ยนขีดกลางเป็นขีดล่าง เมื่อรันโค้ดนี้จะพิมพ์ผลลัพธ์ใด", "o": ["[ north_gate ]", "[north-gate]", "[zone=north_gate]", "[north_gate]"], "a": 3, "e": "substring(5) = \" north-gate \" → trim = \"north-gate\" → replace = \"north_gate\"", "s": "pf", "c": "String line = \"zone= north-gate \";\nString value = line.substring(5).trim().replace(\"-\", \"_\");\nSystem.out.print(\"[\" + value + \"]\");"}, {"n": 75, "q": "คลาส Settings มีคอนสตรักเตอร์เป็น private แต่ทุกครั้งที่เรียก getInstance ผู้เรียกกลับได้รับออบเจ็กต์คนละตัว เมื่อกำหนดให้ใช้ class loader เดียวกันและไม่มีการใช้ reflection หรือ serialization เหตุใดโค้ดนี้จึงยังไม่เป็น Singleton ตามที่ตั้งใจไว้", "o": ["ต้องเปลี่ยนคอนสตรักเตอร์เป็น public เพื่อบังคับให้สร้างออบเจ็กต์ได้เพียงครั้งเดียว", "ต้องใช้ชื่อเมธอดว่า singleton() เท่านั้นจึงจะเป็น Singleton", "getInstance() เรียก new Settings() ทุกครั้ง แทนที่จะคืนอินสแตนซ์เดิมที่เก็บไว้ใช้ร่วมกัน", "คอนสตรักเตอร์ที่เป็น private ทำให้เมธอด static ในคลาสเดียวกันสร้างออบเจ็กต์ไม่ได้"], "a": 2, "e": "ต้องเก็บ instance ไว้ใน static field แล้วคืนตัวเดิม", "s": "pf", "c": "class Settings {\n    private Settings() { }\n    static Settings getInstance() { return new Settings(); }\n}"}, {"n": 76, "q": "ตัวแปร a และ b ในโค้ดด้านล่างอ้างถึงออบเจ็กต์ StringBuffer ตัวเดียวกัน หลังจากแก้ไขข้อความผ่านตัวแปรทั้งสอง โปรแกรมจะพิมพ์ผลลัพธ์ใด", "o": ["go?:true", "go!:false", "go!?:false", "go!?:true"], "a": 3, "e": "a กับ b ชี้ object เดียวกัน: go!? และ a == b เป็น true", "s": "pf", "c": "StringBuffer a = new StringBuffer(\"go\");\nStringBuffer b = a;\na.append(\"!\");\nb.append(\"?\");\nSystem.out.print(a + \":\" + (a == b));"}, {"n": 77, "q": "ผู้พัฒนาต้องการหาผลคูณของ 3, 4 และ 5 แต่โค้ดด้านล่างกลับได้ผลลัพธ์เป็น 0 ควรเปลี่ยนค่าเริ่มต้นของ reduce จาก 0 เป็นค่าใด โดยคงฟังก์ชันสะสมผลลัพธ์ (accumulator) เดิมไว้", "o": ["5", "-1", "1", "3"], "a": 2, "e": "identity ของการคูณคือ 1 → 60", "s": "pf", "c": "int product = Stream.of(3, 4, 5).reduce(0, (a, b) -> a * b);"}, {"n": 78, "q": "คลาส RegistrationService รับ SqlMemberStore ผ่านคอนสตรักเตอร์ นักพัฒนาจึงสรุปว่าได้ใช้หลัก DIP อย่างสมบูรณ์แล้ว แต่บริการนี้ยังพึ่งพาคลาสที่ทำงานกับ SQL โดยตรง ควรปรับอย่างไรให้สอดคล้องกับหลัก DIP มากขึ้น", "o": ["เพิ่ม final ให้ตัวแปรอ้างอิง SqlMemberStore โดยไม่เปลี่ยนชนิดของตัวแปร", "เปลี่ยนชื่อพารามิเตอร์จาก store เป็น abstraction แต่ยังใช้ชนิด SqlMemberStore เหมือนเดิม", "ย้ายคำสั่ง new SqlMemberStore() เข้าไปในทุกเมธอดของบริการ", "ให้บริการพึ่งพาอินเทอร์เฟซ MemberStore และให้ SqlMemberStore เป็นคลาสหนึ่งที่นำอินเทอร์เฟซนี้ไปใช้"], "a": 3, "e": "DIP: พึ่งพา abstraction (interface) ไม่ใช่คลาสจริง", "s": "pf"}, {"n": 79, "q": "ในโค้ดด้านล่าง ตัวแปร names ไม่เคยถูกกำหนดค่าการอ้างอิงใหม่ แต่มีการเพิ่มสมาชิกใน List ผ่าน lambda โค้ดนี้จะคอมไพล์ผ่านหรือไม่ และให้ผลลัพธ์อย่างไร", "o": ["คอมไพล์ไม่ผ่าน เพราะ lambda ไม่อนุญาตให้แก้ไขเนื้อหาของออบเจ็กต์ทุกชนิด", "คอมไพล์ไม่ผ่าน เพราะ Consumer ต้องคืนค่าเป็น String", "คอมไพล์ผ่านและพิมพ์ 2 เพราะตัวแปรอ้างอิงเป็น effectively final แม้สมาชิกใน List จะเปลี่ยนแปลงได้", "คอมไพล์ผ่านแต่พิมพ์ 0 เพราะ lambda ได้รับสำเนา List ว่างที่แยกจากต้นฉบับ"], "a": 2, "e": "lambda ต้องการให้ตัวแปร effectively final (ไม่ถูกกำหนดค่าใหม่) แต่แก้เนื้อหาใน object ได้ → 2", "s": "pf", "c": "List<String> names = new ArrayList<>();\nConsumer<String> save = text -> names.add(text);\nsave.accept(\"Lina\");\nsave.accept(\"Noah\");\nSystem.out.print(names.size());"}, {"n": 80, "q": "กำหนดความสัมพันธ์จากซ้ายไปขวาดังนี้: e", "false:true", "false:false", "true:false"], "a": 3, "e": "add ครั้งแรกเพิ่มได้ true ครั้งที่สองซ้ำ false", "s": "pf", "c": "Set<String> seen = new HashSet<>();\nboolean first = seen.add(\"R4\");\nboolean second = seen.add(\"R4\");\nSystem.out.print(first + \":\" + second);"}, {"n": 84, "q": "ทีมต้องการให้เมธอด parse รองรับทั้งผลลัพธ์ชนิดจำนวนเต็มและชนิดทศนิยม จึงประกาศสองเมธอดด้านล่างไว้ในคลาสเดียวกัน โค้ดนี้จะคอมไพล์ผ่านหรือไม่ เพราะเหตุใด", "o": ["คอมไพล์ผ่าน และ Java รวมผลลัพธ์ทั้งสองให้เป็น double โดยอัตโนมัติ", "คอมไพล์ผ่าน และ Java เลือกเมธอดจากชนิดของตัวแปรที่รับผลลัพธ์เสมอ", "คอมไพล์ไม่ผ่าน เพราะต่างกันเฉพาะชนิดของค่าที่คืน จึงแยกเป็นคนละ overload ไม่ได้", "คอมไพล์ผ่าน แต่เรียกใช้ได้เฉพาะเมธอดที่ประกาศก่อน"], "a": 2, "e": "overload ต้องต่างที่ parameter list ต่างแค่ return type ไม่ได้", "s": "pf", "c": "int parse(String text) { return 1; }\ndouble parse(String text) { return 1.5; }"}, {"n": 85, "q": "มีสองเธรดเพิ่มค่าตัวนับที่ใช้ร่วมกัน โดยแต่ละรอบใช้ synchronized(new Object()) ครอบคำสั่ง value++ แต่บางครั้งค่าตัวนับกลับเพิ่มไม่ครบตามจำนวนครั้งที่ทำงาน ควรแก้การทำงานนี้อย่างไร", "o": ["เพิ่มวงเล็บครอบ value++ โดยไม่เปลี่ยนออบเจ็กต์ที่ใช้ล็อก", "ให้ทุกเธรดใช้ออบเจ็กต์ล็อกตัวเดียวกันครอบขั้นตอนอ่าน เพิ่ม และเขียนค่าตัวนับ", "สร้าง Object ใหม่สองตัวในแต่ละครั้งแทนการสร้างหนึ่งตัว", "เปลี่ยนชื่อ value เป็น synchronizedValue โดยไม่เปลี่ยนวิธีล็อก"], "a": 1, "e": "synchronized กันได้เมื่อใช้ lock object ตัวเดียวกัน new Object() ทุกรอบไม่กันอะไรเลย", "s": "pf"}, {"n": 86, "q": "ProtocolFactory มีหน้าที่สร้าง Encoder และ Decoder ที่ทำงานร่วมกันได้ แต่ทีมใช้ Encoder จาก BinaryFactory ร่วมกับ Decoder จาก TextFactory จนทำให้สื่อสารกันไม่ได้ การใช้ Abstract Factory ตัวเดียวกันเพื่อสร้างออบเจ็กต์ทั้งชุดช่วยรักษาคุณสมบัติใด", "o": ["ความเข้ากันได้ของผลิตภัณฑ์ต่างชนิดที่อยู่ในตระกูลเดียวกัน", "การมีออบเจ็กต์ Encoder เพียงตัวเดียวตลอดทั้ง JVM เสมอ", "การทำให้ Decoder ทุกตัวเป็นคลาสลูกของ Encoder", "การแจ้งเหตุการณ์ให้ผู้สังเกตทุกคนทราบโดยอัตโนมัติ"], "a": 0, "e": "Abstract Factory รับประกันว่า product ในตระกูลเดียวกันเข้ากัน", "s": "pf"}, {"n": 87, "q": "เมธอด withPrefix คืน Function ที่นำ prefix ไปต่อไว้หน้าข้อความ จากโค้ดด้านล่าง ข้อใดอธิบายทั้งลักษณะของฟังก์ชันและผลลัพธ์จากการเรียกใช้ได้ถูกต้อง", "o": ["ไม่เป็น higher-order function เพราะรับ String แทนที่จะรับ Function", "เป็น higher-order function เพราะคืนฟังก์ชัน และ f.apply(\"box\") ให้ผลลัพธ์เป็น \"tag:box\"", "ต้องทำงานบนเธรดใหม่จึงจะคืน \"tag:box\" ได้", "คืน String ทันที จึงไม่สามารถเรียก apply ต่อได้"], "a": 1, "e": "higher-order function = รับหรือคืนฟังก์ชัน · ได้ \"tag:box\"", "s": "pf", "c": "static Function<String, String> withPrefix(String prefix) {\n    return text -> prefix + text;\n}\n// ภายใน main\nFunction<String, String> f = withPrefix(\"tag:\");\nSystem.out.print(f.apply(\"box\"));"}, {"n": 88, "q": "ใน Activity Diagram มีจุดตัดสินใจหลังอ่านค่า quantity โดยมีทางออกเพียงสองทาง คือ [quantity > 0] ไปทำรายการ และ [quantity < 0] ไปแจ้งข้อผิดพลาด หาก quantity = 0 แบบจำลองนี้มีปัญหาอย่างไร", "o": ["จุดตัดสินใจจะเปลี่ยน quantity เป็น 1 เพื่อให้ทำงานต่อได้", "ไม่มีเงื่อนไข guard ใดเป็นจริงเมื่อค่าเป็น 0 จึงต้องกำหนดทางออกสำหรับกรณีนี้ให้ชัดเจน", "เงื่อนไข guard ทั้งสองเป็นจริงพร้อมกัน จึงต้องทำงานทั้งสองทางเสมอ", "UML จะถือว่า 0 มากกว่า 0 โดยอัตโนมัติ"], "a": 1, "e": "guard ต้องครอบคลุมทุกกรณี 0 ไม่ตรงทั้ง > 0 และ < 0 จึงไปต่อไม่ได้", "s": "pf"}, {"n": 89, "q": "คลาส BaseProcess กำหนดให้ run() เป็น final และเรียก load(), transform(), finish() ตามลำดับ โดยประกาศ transform() เป็น abstract หากทีมต้องการเปลี่ยนเฉพาะขั้นตอนแปลงข้อมูล แต่ยังรักษาลำดับการทำงานเดิมไว้ ควรปรับอย่างไรตามแนวทาง Template Method", "o": ["นำ final ออกจาก run() แล้วคัดลอกลำดับการทำงานทั้งสามขั้นไปไว้ในคลาสลูกทุกคลาส", "เปลี่ยนชื่อ run() ทุกครั้งที่เปลี่ยนวิธีทำงานของ transform", "เขียน transform() ไว้ในโค้ดผู้เรียก และไม่เรียก load() กับ finish()", "สร้างคลาสลูกแล้วเขียนการทำงานของ transform() โดยไม่เขียนทับ run()"], "a": 3, "e": "Template Method: คลาสลูกเขียนเฉพาะขั้นที่ต่าง (transform) run() ที่เป็น final คุมลำดับเดิม", "s": "pf"}, {"n": 90, "q": "กฎตรวจสอบระยะเวลาเช่าต้องนำไปใช้ได้ทั้งในโปรแกรม Swing และโปรแกรมแบบบรรทัดคำสั่ง (command line) แต่คลาส RentalRules เรียก JOptionPane.showMessageDialog() ภายในเมื่อพบข้อมูลไม่ถูกต้อง ควรปรับอย่างไรเพื่อให้กฎตรวจสอบพึ่งพาส่วนแสดงผลน้อยที่สุด", "o": ["รวม SQL และโค้ดของทุกหน้าจอไว้ใน RentalRules เพื่อให้ใช้เพียงคลาสเดียว", "ให้กฎคืนผลการตรวจสอบหรือแจ้งข้อผิดพลาดตามข้อตกลงการเรียกใช้ แล้วให้แต่ละหน้าจอเลือกวิธีแสดงผลเอง", "คัดลอกกฎทั้งหมดไปไว้ในทุกหน้าจอและทุกคำสั่งของโปรแกรม command line", "ให้โปรแกรม command line สร้าง JFrame ทุกครั้งก่อนเรียกใช้กฎ"], "a": 1, "e": "แยกกฎธุรกิจออกจาก UI (SRP / low coupling) ให้แต่ละหน้าจอแสดงผลเอง", "s": "pf"}, {"n": 91, "q": "กำหนดให้ Runnable และ AutoCloseable เป็น interface เมื่อต้องเขียนโมเดลให้สอดคล้องกับการประกาศคลาส Java ต่อไปนี้ ควรใช้ลูกศรชนิดใดเชื่อมจาก Console ไปยังชนิดข้อมูลที่เกี่ยวข้อง", "o": ["ลูกศร Realization ไปยัง BaseConsole หนึ่งเส้น และลูกศร Composition ไปยังแต่ละ interface", "ลูกศร Generalization ไปยังทั้งสามชนิด รวมสามเส้น", "ลูกศร Association ไปยัง BaseConsole และลูกศร Aggregation ไปยังทั้งสอง interface", "ลูกศร Generalization ไปยัง BaseConsole หนึ่งเส้น และลูกศร Realization ไปยังแต่ละ interface อีกสองเส้น"], "a": 3, "e": "extends คลาส = Generalization (เส้นทึบ) · implements interface = Realization (เส้นประ) อย่างละเส้น", "s": "pf", "c": "class Console extends BaseConsole\n        implements Runnable, AutoCloseable {\n    public void run() { }\n    public void close() { }\n}"}, {"n": 92, "q": "การเปิดโครงการต้องเริ่มจากตรวจสอบไฟล์ จากนั้นโหลดทรัพยากร และเริ่มแสดงตัวอย่างตามลำดับ แต่ client หลายตัวต้องเขียนขั้นตอนเหล่านี้ซ้ำกันและมักเรียกผิดลำดับ การให้ client เรียก ProjectFacade.open() ช่วยแก้ปัญหาใดได้โดยตรงที่สุด", "o": ["ทำให้การเปิดโครงการทุกครั้งทำงานพร้อมกันได้โดยไม่ต้องจัดการ thread", "รวมการประสานงานระหว่างระบบย่อยไว้เบื้องหลังช่องทางเรียกใช้งานระดับสูงที่เรียบง่าย", "ทำให้ระบบย่อยทั้งหมดกลายเป็นออบเจ็กต์เดียวและไม่เกิดข้อผิดพลาดอีก", "บังคับให้ client ทุกตัวสืบทอดจากระบบย่อยทั้งสาม"], "a": 1, "e": "Facade รวมขั้นตอนของระบบย่อยไว้หลังเมธอดเดียวที่ใช้ง่าย", "s": "pf"}, {"n": 93, "q": "ต้องการใช้ lambda (left, right) -> left.length() > right.length() โดยกำหนดให้พารามิเตอร์ทั้งสองตัวเป็น String เมธอด abstract เพียงเมธอดเดียวของ functional interface ที่ใช้กับ lambda นี้ควรมีรูปแบบใด", "o": ["void test(String left, String right);", "String test(String left, String right);", "boolean test(String left);", "boolean test(String left, String right);"], "a": 3, "e": "รับ String สองตัวและคืน boolean (ผลของ >) · เทียบได้กับ BiPredicate<String,String>", "s": "pf"}, {"n": 94, "q": "ระบบใหม่ต้องอ่านอุณหภูมิผ่าน Temperature.readCelsius() แต่เซนเซอร์เดิมมีเพียง readFahrenheit() ซึ่งคืนค่าอุณหภูมิฟาเรนไฮต์เป็น double หากใช้สูตร C = (F - 32) × 5 / 9 ควรเขียน Adapter แบบใดให้ทำงานได้ตรงตามข้อกำหนดของระบบใหม่", "o": ["ให้ readCelsius() เรียกเมธอดของเซนเซอร์เดิม แล้วคืนค่า (old.readFahrenheit() - 32.0) * 5.0 / 9.0", "ให้ทุก implementation ของ Temperature ใช้ extends เพื่อสืบทอดจากเซนเซอร์เดิม โดยไม่ต้องแปลงหน่วย", "ให้ readCelsius() คืนค่า old.readFahrenheit() โดยตรง เพราะเปลี่ยนชื่อเมธอดแล้ว", "ให้ readCelsius() สร้างเซนเซอร์ใหม่ แล้วคืนจำนวน instance ที่สร้างขึ้น"], "a": 0, "e": "Adapter เรียกเซนเซอร์เดิมแล้วแปลงหน่วยให้ตรงกับ interface ใหม่", "s": "pf"}, {"n": 95, "q": "โปรแกรมมี Reward หลายชนิด โดยแต่ละชนิด override points() ให้ทำงานต่างกัน ต้องการให้เพิ่ม Reward ชนิดใหม่ได้โดยไม่ต้องเพิ่ม if เพื่อตรวจชื่อคลาสในลูปรวมคะแนน ควรเขียนลูปอย่างไร", "o": ["วนผ่าน Reward แต่ละออบเจ็กต์ แล้วนำค่า r.points() ที่เรียกผ่านชนิดฐานมารวมกัน", "เปลี่ยน points() เป็น static แล้วให้ระบบเลือกเมธอดตามออบเจ็กต์ขณะรัน", "อ่านชื่อคลาสเป็น String แล้วเพิ่ม if แยกการทำงานสำหรับทุกชนิด", "แปลงออบเจ็กต์ทุกตัวเป็นคลาสลูกชนิดเดียวกันก่อนเรียกเมธอด"], "a": 0, "e": "polymorphism: เรียก points() ผ่านชนิดฐาน แต่ละชนิดทำงานของตัวเอง", "s": "pf"}, {"n": 96, "q": "โปรแกรมต้องรับ callback ที่รับข้อความหนึ่งค่าเพื่อนำไปเขียนลงบันทึก โดยไม่คืนค่าใดกลับมา ชนิดใดเหมาะกับ callback นี้มากที่สุด", "o": ["Function<String, Integer>", "Predicate<String>", "Consumer<String>", "Supplier<String>"], "a": 2, "e": "Consumer รับค่าแล้วไม่คืนอะไร", "s": "pf"}, {"n": 97, "q": "ผู้พัฒนากำลังจัดหมวดหมู่ตัวอย่าง Design Patterns ในคู่มือ คู่ใดประกอบด้วย GoF Structural Patterns ทั้งสองรายการ", "o": ["Facade และ Composite", "Singleton และ Facade", "Factory Method และ Abstract Factory", "Observer และ Strategy"], "a": 0, "e": "Facade และ Composite เป็น Structural · Singleton/Factory = Creational · Observer/Strategy = Behavioral", "s": "pf"}, {"n": 98, "q": "ชุดทดสอบเปิดแอปจริง กรอกข้อมูลผ่านหน้าจอ และยืนยันการสมัคร จากนั้นตรวจสอบว่าผู้ใช้สามารถเข้าสู่ระบบด้วยบัญชีที่สร้างขึ้นได้ โดยทดสอบการทำงานตั้งแต่หน้าจอผ่านบริการไปจนถึงฐานข้อมูลครบทั้งกระบวนการ การทดสอบนี้ตรงกับประเภทใดมากที่สุด", "o": ["การตรวจสอบเฉพาะไวยากรณ์ด้วย compiler", "การทดสอบเฉพาะการเชื่อมต่อระหว่าง repository กับฐานข้อมูล โดยไม่ครอบคลุมขั้นตอนที่ผู้ใช้ทำ", "End-to-End Test", "Unit Test ของฟังก์ชันเดียว โดยแยก dependency ทั้งหมดออก"], "a": 2, "e": "ทดสอบครบตั้งแต่หน้าจอถึงฐานข้อมูลตามเส้นทางผู้ใช้ = End-to-End", "s": "pf"}, {"n": 99, "q": "โปรแกรมต้องนับจำนวนรายการที่อ่านทั้งหมด แต่รวมยอดเฉพาะค่าที่เป็นบวก เมื่อรันโค้ดต่อไปนี้ โปรแกรมจะแสดงผลลัพธ์ใด", "o": ["4:10", "2:10", "4:12", "2:12"], "a": 2, "e": "visited นับทุกตัว (4) · total รวมเฉพาะบวก 5 + 7 = 12", "s": "pf", "c": "int visited = 0, total = 0;\nfor (int n : new int[]{0, 5, -2, 7}) {\n    visited++;\n    if (n <= 0) continue;\n    total += n;\n}\nSystem.out.print(visited + \":\" + total);"}, {"n": 100, "q": "โค้ดต่อไปนี้แปลงแต่ละคำเป็นจำนวนตัวอักษร แล้วกรองและนับรายการที่ผ่านเงื่อนไข เมื่อทำงานเสร็จ ตัวแปร count จะมีค่าเท่าใด", "o": ["4", "3", "2", "12"], "a": 2, "e": "ความยาว 1, 4, 4, 3 · ที่ > 3 มี 2 ตัว", "s": "pf", "c": "long count = List.of(\"a\", \"pear\", \"kiwi\", \"fig\").stream()\n        .map(word -> word.length())\n        .filter(length -> length > 3)\n        .count();\nSystem.out.print(count);"}, {"n": 101, "q": "ต้องการเขียน unit test ให้ NotifyWhenAvailable โดยแทน stock ด้วย test double ที่ระบุว่าไม่มีสินค้า และแทน notifier ด้วยตัวนับจำนวนครั้งที่ส่งแจ้งเตือน หากข้อกำหนดระบุว่าต้องไม่ส่งแจ้งเตือนเมื่อไม่มีสินค้า ควรใช้ assertion ใดตรวจสอบพฤติกรรมนี้", "o": ["หลังเรียก service ให้ตรวจสอบว่าจำนวนครั้งที่ส่งแจ้งเตือนเท่ากับ 0", "ตรวจสอบเพียงว่าตัวแปร stock ไม่เป็น null โดยไม่ต้องเรียก service", "ตรวจสอบว่ามีการส่งแจ้งเตือนไปยังผู้ใช้จริงอย่างน้อยหนึ่งครั้ง", "รอห้าวินาที แล้วถือว่าการทดสอบผ่านโดยไม่ใช้ assertion"], "a": 0, "e": "ข้อกำหนดคือต้องไม่ส่ง จึงตรวจว่าตัวนับเป็น 0", "s": "pf"}, {"n": 102, "q": "ระบบนำเข้าข้อมูลรองรับ Reader หลายชนิด โดยส่วนประมวลผลหลักเรียกใช้งานผ่าน interface เดียวกัน ข้อใดแสดงได้ชัดเจนที่สุดว่าการออกแบบนี้รองรับการเพิ่มรูปแบบไฟล์ใหม่ตามหลัก OCP", "o": ["คัดลอกคลาสประมวลผลหลักทั้งคลาส แล้วเปลี่ยนนามสกุลไฟล์ในสำเนา", "เพิ่ม implementation ใหม่ของ Reader และลงทะเบียนเพื่อใช้งาน โดยไม่แก้ algorithm หลักที่ผ่านการทดสอบแล้ว", "เปิดให้ผู้ใช้แก้ไข private field ทุกตัวของส่วนประมวลผลหลักได้โดยตรง", "เพิ่ม if สำหรับไฟล์ชนิดใหม่ในทุกหน้าจอที่เรียกใช้งานการนำเข้า"], "a": 1, "e": "OCP: เพิ่ม Reader ใหม่โดยไม่แก้โค้ดหลักเดิม", "s": "pf"}, {"n": 103, "q": "ไลบรารีรับ String ที่ผู้เรียกใช้เป็นชื่อรายการ ผู้พัฒนาไลบรารีอ้างว่าการเรียก replace() จะเปลี่ยนตัวอักษรภายในออบเจ็กต์ String เดิม ทำให้ผู้เรียกเห็นข้อความใหม่ผ่าน reference เดิมได้ ข้อใดประเมินคำกล่าวนี้ได้ถูกต้อง", "o": ["ไม่ถูกต้อง เพราะ String ไม่สามารถเปลี่ยนเนื้อหาภายในออบเจ็กต์เดิมได้ และเมธอดจะคืนผลลัพธ์เป็น String", "ไม่ถูกต้อง เพราะ String ไม่มีเมธอด replace()", "ถูกต้องเฉพาะเมื่อผู้เรียกประกาศตัวแปรเป็น final", "ถูกต้อง เพราะ replace() จะแปลง String เป็น StringBuffer ก่อนทำงาน"], "a": 0, "e": "String เป็น immutable replace() คืน String ใหม่ ตัวเดิมไม่เปลี่ยน", "s": "pf"}, {"n": 104, "q": "เมธอด copy() ในโค้ดต่อไปนี้ใช้ super.clone() โดยไม่ได้คัดลอก array เพิ่มเติม หลังจากแก้ไขข้อมูลผ่านสำเนาแล้ว การอ่านค่าจากออบเจ็กต์ต้นฉบับจะแสดงผลลัพธ์ใด", "o": ["8:new", "2:new", "2:old", "8:old"], "a": 3, "e": "shal  A]", "[B, A, C]", "[A, C, A, B]", "[B, A, C, A]"], "a": 3, "e": "[A,B,A] → set(1,\"C\") = [A,C,A] → add(0,\"B\") = [B,A,C,A]", "s": "pf", "c": "List<String> route = new ArrayList<>(List.of(\"A\", \"B\", \"A\"));\nroute.set(1, \"C\");\nroute.add(0, \"B\");\nSystem.out.print(route);"}, {"n": 108, "q": "ต้องการให้ System.out.println(device) แสดงข้อความตามที่กำหนดไว้ในคลาส Device เมธอดข้อใด override toString ของ Object ได้อย่างถูกต้อง", "o": ["public String toString(int style) { return \"device\"; }", "public void toString() { System.out.print(\"device\"); }", "public String toString() { return \"device\"; }", "public static String toString() { return \"device\"; }"], "a": 2, "e": "ต้อง public, คืน String, ไม่มีพารามิเตอร์ และไม่ใช่ static", "s": "pf"}, {"n": 109, "q": "ผู้พัฒนาคาดว่าการเรียก new Ticket() จะกำหนดราคาเป็น 50 แต่โค้ดต่อไปนี้กลับแสดงค่า 0 ข้อใดอธิบายสาเหตุได้ถูกต้อง", "o": ["เมธอดชื่อ Ticket ต้องเป็น static จึงจะถือว่าเป็น constructor", "field ชนิด int ไม่สามารถเปลี่ยนค่าเริ่มต้นได้", "Java ไม่อนุญาตให้ constructor กำหนดค่าให้ field", "void Ticket() เป็นเมธอด ไม่ใช่ constructor จึงไม่ถูกเรียกโดยอัตโนมัติเมื่อใช้ new"], "a": 3, "e": "constructor ไม่มี return type ใส่ void แล้วกลายเป็นเมธอดธรรมดา price จึงเป็น 0", "s": "pf", "c": "class Ticket {\n    int price;\n    void Ticket() { price = 50; }\n}\n// ภายใน main\nSystem.out.print(new Ticket().price);"}, {"n": 110, "q": "หลังเชื่อมต่อ TCP สำเร็จ ทั้ง client และ server เรียก readLine() เป็นคำสั่งแรก โดยยังไม่มีฝ่ายใดส่งข้อมูล ไม่มีการกำหนด timeout และการเชื่อมต่อยังเปิดอยู่ สถานการณ์นี้อาจเกิดปัญหาใด และควรแก้ไขอย่างไร", "o": ["ควรสร้าง BufferedReader สองตัวบน stream เดิม เพื่อให้มีข้อมูลให้อ่าน", "ไม่ต้องกำหนดลำดับการสื่อสาร เพราะ TCP จะสร้างข้อความเริ่มต้นให้เอง", "ทั้งสองฝ่ายอาจรอข้อมูลไม่สิ้นสุด จึงควรกำหนดใน protocol ให้ชัดเจนว่าฝ่ายใดต้องส่งข้อความก่อน", "readLine() ต้องคืนสตริงว่างทันที เพราะยังไม่มีข้อมูลให้อ่าน"], "a": 2, "e": "readLine() บล็อกรอทั้งสองฝ่าย ต้องกำหนด protocol ว่าใครส่งก่อน", "s": "p , "ให้ draw() ของ BorderDecorator เรียกตัวเองซ้ำก่อนเรียก drawBorder() โดยไม่มีเงื่อนไขหยุด", "ลบ field inner แล้ววาดเฉพาะกรอบต่อไป"], "a": 1, "e": "Decorator ต้องส่งต่อให้ตัวที่ห่อ (inner.draw()) แล้วเพิ่มพฤติกรรมของตัวเอง", "s": "pf"}, {"n": 115, "q": "ทีมพัฒนาเขียนโปรแกรมด้วยภาษา C มาตรฐาน โดยเก็บข้อมูลไว้ใน struct แล้วส่ง struct ให้ฟังก์ชันทำงาน สมาชิกคนหนึ่งจึงสรุปว่า C มีกลไก class และ inheritance ในตัวอยู่แล้ว ข้อใดโต้แย้งข้อสรุปนี้ได้ตรงประเด็นที่สุด", "o": ["การมีฟังก์ชันหลายตัวทำให้ struct สืบทอดจากกันได้โดยอัตโนมัติ", "เมื่อคอมไพล์สำเร็จ struct ทุกตัวจะถูกแปลงเป็น Java class โดยอัตโนมัติ", "เพียงตั้งชื่อฟังก์ชันให้เหมือนชื่อ struct ก็จะได้ constructor แบบ Java", "การใช้ struct ร่วมกับฟังก์ชันไม่ได้ทำให้ class และ inheritance กลายเป็นกลไกที่ภาษามีให้ในตัว"], "a": 3, "e": "C เป็น procedural ไม่มี class/inheritance ในตัวภาษา การใช้ struct + ฟังก์ชันไม่ได้ทำให้มี", "s": "pf"}, {"n": 116, "q": "โมเดลใช้เส้นเชื่อมระหว่าง ResearchGroup กับ Researcher โดยมีเพชรโปร่งอยู่ที่ฝั่ง ResearchGroup นักพัฒนาคนหนึ่งจึงสรุปว่าเมื่อลบกลุ่ม ต้องลบข้อมูลนักวิจัยทุกคนในกลุ่มตามไปด้วยเสมอ ข้อใดประเมินข้อสรุปนี้ได้ถูกต้อง", "o": ["สรุปเช่นนั้นได้เสมอ เพราะเพชรโปร่งและเพชรทึบมีความหมายเรื่องวงจรชีวิตเหมือนกัน", "สรุปเช่นนั้นได้เสมอ เพราะส่วนประกอบหรือ part ต้องเป็น subclass ขององค์รวมหรือ whole", "ยังสรุปจากเพชรโปร่งเพียงอย่างเดียวไม่ได้ เพราะ Shared Aggregation ไม่ได้บังคับวงจรชีวิตแบบ Composition", "สรุปเช่นนั้นไม่ได้ เพราะเพชรโปร่งหมายถึง interface ไม่ใช่ความสัมพันธ์"], "a": 2, "e": "เพชรโปร่ง = aggregation ไม่ได้บังคับให้ part ตายตาม whole (นั่นคือเพชรทึบ)", "s": "pf"}, {"n": 117, "q": "ออบเจ็กต์ Lamp แต่ละตัวมี field on ของตนเอง เมื่อรันโค้ดต่อไปนี้ ค่าของ a.on และ c.on ที่แสดงออกมาจะเป็นอย่างไร", "o": ["true:true", "true:false", "false:true", "false:false"], "a": 1, "e": "b ชี้ object เดียวกับ a จึง a.on = true · c เป็นอีก object ยัง false", "s": "pf", "c": "class Lamp { boolean on; }\n// ภายใน main\nLamp a = new Lamp();\nLamp b = a;\nLamp c = new Lamp();\nb.on = true;\nSystem.out.print(a.on + \":\" + c.on);"}, {"n": 118, "q": "โมเดล [Reservation] 1 —— 2..5 [Seat] กำหนดให้ Seat ทุกตัวในข้อมูลชุดนี้เชื่อมกับ Reservation หนึ่งรายการพอดี หากมี Reservation 4 รายการ และไม่มี Seat นอกความสัมพันธ์นี้ จำนวน Seat ทั้งหมดจะเป็นไปได้ในช่วงใด", "o": ["4 ถึง 20 ตัว", "4 ถึง 5 ตัว", "2 ถึง 5 ตัว", "8 ถึง 20 ตัว"], "a": 3, "e": "4 การจอง × 2..5 ที่นั่ง และแต่ละที่นั่งอยู่การจองเดียว → 8 ถึง 20", "s": "pf"}, {"n": 119, "q": "แอป client เชื่อมต่อด้วย new Socket(\"127.0.0.1\", 6200) ได้เมื่อ client และ server อยู่บนเครื่องเดียวกัน แต่เมื่อย้าย client ไปยังโน้ตบุ๊กอีกเครื่องในเครือข่ายเดียวกัน กลับเชื่อมต่อกับ server เดิมไม่ได้ ควรตรวจสอบและแก้ไขค่าปลายทางอย่างไร", "o": ["คง 127.0.0.1 ไว้ เพราะหมายถึง server เครื่องแรกที่เคยเชื่อมต่อเสมอ", "เปลี่ยน host เป็น IP หรือชื่อเครื่อง server ที่เข้าถึงได้ เพราะ 127.0.0.1 บนโน้ตบุ๊กหมายถึงตัวโน้ตบุ๊กเอง", "เปลี่ยน port เป็นหมายเลขใดก็ได้ โดยไม่จำเป็นต้องตรงกับ server", "เปลี่ยนชื่อคลาส Socket เป็น ServerSocket โดยยังคงให้โปรแกรมทำหน้าที่ client ตามเดิม"], "a": 1, "e": "127.0.0.1 คือเครื่องตัวเอง ต้องใช้ IP/ชื่อของเครื่อง server", "s": "pf"}, {"n": 120, "q": "โค้ดต่อไปนี้ใช้ sequential stream และมี collect เป็น terminal operation โปรแกรมจะแสดงจำนวนอักขระใน trace ก่อนและหลังเรียก collect เป็นผลลัพธ์ใด", "o": ["0:3", "0:0", "3:3", "3:6"], "a": 0, "e": "map เป็น lazy ยังไม่ทำจนกว่าจะ collect: ก่อน 0 หลัง 3", "s": "pf", "c": "StringBuffer trace = new StringBuffer();\nStream<Integer> pending = Stream.of(2, 4, 6).map(n -> {\n    trace.append(\"*\");\n    return n + 1;\n});\nSystem.out.print(trace.length() + \":\");\nList<Integer> result = pending.collect(Collectors.toList());\nSystem.out.print(trace.length());"}];

<script>
const KEY = "oopfinal-v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const L = "ABCDE";
function seeded(seed) { let h = 7; for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; }; }
function ordFor(key, q) { const n = q.o.map((_, i) => i); const r = seeded(key); for (let i = n.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [n[i], n[j]] = [n[j], n[i]]; } return n; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wrapTables = h => h.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, '</table></div>');

if (!PAGES.find(p => p.id === cur)) cur = "home";

  document.getElementById("tabs").innerHTML = PAGES.map(p => `<button class="tab${p.id === "mock" || p.id === "pf" || p.id === "fc" ? " x" : ""}${p.w === "hi" ? " hi" : ""}" role="tab" aria-selected="${p.id === cur}" data-id="${p.id}">${esc(p.lec)}<small>${esc(p.title)}</small></button>`).join("");

}
