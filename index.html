  let tot = 0, ok = 0, bad = 0;
  TOPICS.forEach(t => { tot += t.quiz.length; const s = store[t.id] || {}; t.quiz.forEach((q, i) => { if (s[i] !== undefined) { s[i] === q.a ? ok++ : bad++; } }); });
  { tot += PF.length; const s = store.pf || {}; PF.forEach((q, i) => { if (s[i] !== undefined) { s[i] === q.a ? ok++ : bad++; } }); }
  const done = ok + bad, pct = Math.round(done / tot * 100);
  document.getElementById("rfg").style.strokeDashoffset = 263.9 * (1 - done / tot);
  document.getElementById("rpct").textContent = pct + "%";
  document.getElementById("gtxt").innerHTML = `<span><b>${done}</b>/ ${tot} ข้อ</span><span><b>${ok}</b>ถูก</span><span><b>${done ? Math.round(ok / done * 100) : 0}%</b>ความแม่น</span>`;
}

function qCard(q, num, picked, key, order, tag) {
  const ord = order || q.o.map((_, i) => i);
  const done = picked !== undefined;
  const opts = ord.map((oi, pos) => {
    let cls = ""; if (done) { if (oi === q.a) cls = "right"; else if (oi === picked) cls = "wrong"; }
    return `<button class="opt ${cls}" data-k="${key}" data-o="${oi}" ${done ? "disabled" : ""}><b>${L[pos]}</b><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  let exp = "";
  if (done) { const okk = picked === q.a; exp = `<div class="exp"><strong class="${okk ? "ok" : "bad"}">${okk ? "ถูก" : "ผิด — ตอบ " + L[ord.indexOf(q.a)]}</strong> · ${esc(q.e)}</div>`; }
  const badge = q.s === "t" ? `<span class="badge cw">อาจารย์ชี้</span>` : q.s === "pf" ? "" : `<span class="badge ex">ฝึกเพิ่ม</span>`;
  return `<div class="q"><div class="qh"><span class="qn">${num}</span><span class="qt">${esc(q.q)}</span>${badge}</div>${tag ? `<div class="qmeta">${esc(tag)}</div>` : ""}${q.c ? `<pre class="code">${esc(q.c)}</pre>` : ""}<div class="opts">${opts}</div>${exp}</div>`;
}

}
function fcMove(d, n) { const j = fc.i + d; if (j < 0 || j >= n) return; fc.i = j; fc.flip = false; render(); }
function fcFlip() { fc.flip = !fc.flip; const el = document.getElementById("fcc"); if (el) el.classList.toggle("on", fc.flip); }
function fcMark(c, val, n) {
  store.fc[c.k] = val; save();
  if (fc.only && val) { fc.order = null; fc.flip = false; render(); return; }
  if (fc.i < n - 1) fcMove(1, n); else render();
}
function fcBind(v, cards, c) {
  v.querySelectorAll(".chip[data-d]").forEach(b => b.onclick = () => { fc.deck = b.dataset.d; fcReset(); render(); });
  v.querySelector("#fcsel").onchange = e => { fc.topic = e.target.value; fcReset(); render(); };
  v.querySelectorAll(".chip[data-o]").forEach(b => b.onclick = () => { fc.only = b.dataset.o === "1"; fcReset(); render(); });
  v.querySelector("#fcsh").onclick = () => { fc.order = shuffle(cards.map((_, i) => i)); fc.i = 0; fc.flip = false; render(); };
  v.querySelector("#fcrs").onclick = () => { if (confirm("ล้างสถานะ \"จำได้\" ของชุดนี้?")) { FCD[fc.deck].build().forEach(x => delete store.fc[x.k]); save(); fcReset(); render(); } };
  if (!c) return;
  const card = v.querySelector("#fcc"); card.onclick = fcFlip;
  v.querySelector("#fcp").onclick = () => fcMove(-1, cards.length);
  v.querySelector("#fcn").onclick = () => fcMove(1, cards.length);
  v.querySelector("#fcno").onclick = () => fcMark(c, 0, cards.length);
  v.querySelector("#fcyes").onclick = () => fcMark(c, 1, cards.length);
}
document.addEventListener("keydown", e => {
  if (cur !== "fc" || e.target.closest("input,textarea,select") || e.altKey || e.ctrlKey || e.metaKey) return;
  const n = fcCards().length; if (!n) return;
  if (e.key === " " || e.key === "Enter") { if (e.target.closest("button:not(#fcc)")) return; e.preventDefault(); fcFlip(); }
  else if (e.key === "ArrowRight") fcMove(1, n);
  else if (e.key === "ArrowLeft") fcMove(-1, n);
});

let mock = null;
const TC = TOPICS.reduce((c, t) => c + t.quiz.filter(q => q.s === "t").length, 0);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startMock(n) {
  const hi = [], lo = [];
  TOPICS.forEach(t => t.quiz.forEach(q => (t.w === "hi" ? hi : lo).push({ ...q, ref: t.lec + " · " + t.title })));
  let pick;
  if (n === "t") pick = shuffle([...hi, ...lo].filter(q => q.s === "t"));
  else if (n === "tpf") pick = shuffle([...hi, ...lo].filter(q => q.s === "t").concat(PF.map(q => ({ ...q, ref: "Practice Final ข้อ " + q.n }))));
  else if (n >= hi.length + lo.length) pick = shuffle([...hi, ...lo]);
  else { const nh = Math.min(hi.length, Math.round(n * 0.75)); pick = shuffle([...shuffle(hi).slice(0, nh), ...shuffle(lo).slice(0, n - nh)]); }
  mock = { n, qs: pick.map(q => ({ q, order: shuffle(q.o.map((_, i) => i)), p: undefined })) };
  render();
}
function renderMock(v) {
  let h = `<h2>สอบรวม</h2><p class="sub">สุ่มจากทุกบท เน้นหลังกลางภาค 75% ก่อนกลางภาค 25% และสลับตำแหน่งตัวเลือก ตอบแล้วเฉลยทันที · ปุ่ม "เฉพาะอาจารย์ชี้" รวมเฉพาะข้อที่อาจารย์ชี้จากทุกบท · ปุ่ม "อาจารย์ชี้ + Practice Final" รวมข้ออาจารย์ชี้กับ Practice Final ทั้ง 120 ข้อ</p><div class="mockbar">${[["tpf", `อาจารย์ชี้ + Practice Final (${TC + PF.length} ข้อ)`], ["t", `เฉพาะอาจารย์ชี้ (${TC} ข้อ)`], [30, "สุ่ม 30 ข้อ"], [60, "สุ่ม 60 ข้อ"], [9999, "ทุกข้อ"]].map(([n, l]) => `<button class="btn${mock && mock.n === n ? "" : " ghost"}" data-n="${n}">${l}</button>`).join("")}</div>`;
  if (mock) {
    const ans = mock.qs.filter(x => x.p !== undefined), ok = ans.filter(x => x.p === x.q.a).length;
    h += `<div class="result"><div class="big">${ok}<span style="font-size:1.1rem">/${mock.qs.length}</span></div><div class="rb"><div>ตอบแล้ว ${ans.length} ข้อ${ans.length === mock.qs.length ? ` · ได้ ${Math.round(ok / mock.qs.length * 100)}%` : ""}</div><div class="bar"><i class="g" style="width:${ok / mock.qs.length * 100}%"></i><i class="r" style="width:${(ans.length - ok) / mock.qs.length * 100}%"></i></div></div></div>`;
    h += mock.qs.map((x, i) => qCard(x.q, i + 1, x.p, "m:" + i, x.order, x.q.ref)).join("");
  } else {
    h += `<p class="empty">เลือกจำนวนข้อด้านบนเพื่อเริ่ม</p>`;
  }
  v.innerHTML = h;
  v.querySelectorAll(".btn[data-n]").forEach(b => b.onclick = () => startMock(isNaN(b.dataset.n) ? b.dataset.n : +b.dataset.n));
  v.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => { const i = +b.dataset.k.split(":")[1]; mock.qs[i].p = +b.dataset.o; const y = window.scrollY; render(); window.scrollTo(0, y); });
}

function render() {
  const v = document.getElementById("view");
  if (cur === "home") renderHome(v);
  else if (cur === "mock") renderMock(v);
  else if (cur === "pf") renderPF(v);
  else if (cur === "fc") renderFC(v);
  else renderTopic(v, TOPICS.find(t => t.id === cur));
  const ot = v.querySelector("#onlyT"); if (ot) ot.onclick = () => { go("mock"); startMock("t"); };
  const at = v.querySelector("#allTPF"); if (at) at.onclick = () => { go("mock"); startMock("tpf"); };
  v.querySelectorAll("[data-go]").forEach(a => a.onclick = e => { e.preventDefault(); go(a.dataset.go); });
  globalMeter();
}
renderTabs(); render();

</script>
